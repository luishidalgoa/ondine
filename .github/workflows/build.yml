name: Compilar y publicar

# - Al empujar un tag vX.Y.Z: verifica el contrato del CHANGELOG, compila el instalador
#   de Windows y la herramienta de línea de órdenes para Windows, Linux y macOS, y lo
#   adjunta todo al Release de ese tag.
# - Manualmente (workflow_dispatch): compila y deja todo como artefactos descargables.
#
# NOTA sobre la interfaz gráfica: hay DOS. La de WPF solo existe en Windows y es la que
# lleva el instalador. La de Avalonia es multiplataforma y de ella sale el .deb de Linux
# —Mint, Ubuntu, Debian—. Para macOS y para las arquitecturas sueltas se sigue publicando
# «ondine», la versión de terminal, que comparte el mismo motor que las dos.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # El contrato del CHANGELOG se comprueba ANTES de compilar: si no se cumple,
  # no se publica nada.
  # ---------------------------------------------------------------------------
  verificar-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Hace falta para la comprobación de traducción de más abajo. La versión
      # que trae el runner de serie no está garantizada, y este trabajo es la
      # puerta que decide si se publica: no puede depender de la suerte.
      - name: Instalar .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Comprobar el contrato del CHANGELOG
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          else
            VER=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/Ondine/Ondine.csproj | head -1)
            echo "Sin tag: se valida la versión del proyecto ($VER)."
          fi

          echo "Versión a validar: $VER"

          # 1) formato SemVer
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::«$VER» no es SemVer X.Y.Z"; exit 1; }

          # 2) existe la sección con fecha ISO
          grep -qE "^## \[$(echo "$VER" | sed 's/\./\\./g')\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::Falta en CHANGELOG.md la sección «## [$VER] - AAAA-MM-DD»"; exit 1; }

          # 3) todos los .csproj declaran esa misma versión
          for p in src/Ondine/Ondine.csproj src/Ondine.Core/Ondine.Core.csproj src/Ondine.Cli/Ondine.Cli.csproj src/Ondine.Avalonia/Ondine.Avalonia.csproj; do
            PV=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' "$p" | head -1)
            [[ "$PV" == "$VER" ]] \
              || { echo "::error::$p declara <Version>$PV</Version> pero se publica $VER"; exit 1; }
          done

          # 4) la sección tiene contenido y solo usa categorías permitidas
          BODY=$(awk -v v="## [$VER]" 'index($0,v)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
          [[ -n "$(echo "$BODY" | tr -d '[:space:]')" ]] \
            || { echo "::error::La sección [$VER] está vacía"; exit 1; }
          while read -r h; do
            [[ -z "$h" ]] && continue
            case "$h" in
              "### Añadido"|"### Cambiado"|"### Obsoleto"|"### Eliminado"|"### Corregido"|"### Seguridad"|"### Notas") ;;
              *) echo "::error::Categoría no permitida en [$VER]: $h"; exit 1 ;;
            esac
          done < <(echo "$BODY" | grep '^### ' || true)

          # 5) sin versiones repetidas
          DUP=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | sort | uniq -d)
          [[ -z "$DUP" ]] || { echo "::error::Versiones repetidas: $DUP"; exit 1; }

          # 6) el propio documento sigue entero: las 7 reglas del contrato y la sección
          #    de pendientes. Al cortar la v0.5.0 un reemplazo automático se comió media
          #    cabecera y nadie se enteró, porque nada comprobaba el contrato en sí.
          REGLAS=$(grep -cE '^[1-7]\. \*\*' CHANGELOG.md || true)
          [[ "$REGLAS" -eq 7 ]] \
            || { echo "::error::El contrato del CHANGELOG está incompleto: $REGLAS de 7 reglas"; exit 1; }
          grep -q '^## \[Unreleased\]$' CHANGELOG.md \
            || { echo "::error::Falta la sección «## [Unreleased]» en CHANGELOG.md"; exit 1; }

          echo "Contrato del CHANGELOG cumplido."

          # las notas de la Release salen del propio CHANGELOG
          { echo "$BODY"; } > release-notes.md

      # Durante el desarrollo se escribe en castellano y el resto de idiomas se
      # rellenan después, a petición. Eso ahorra trabajo real: un texto que va a
      # cambiar tres veces no se traduce tres veces.
      #
      # Pero «luego lo rellenamos» se convierte en nunca si nada lo comprueba.
      # Aquí es donde deja de valer: al cortar una versión, ni un solo texto
      # puede quedar pendiente. Se corre en el MISMO trabajo que valida el
      # CHANGELOG porque es la misma puerta, la que decide si se publica.
      - name: Comprobar que no queda nada sin traducir
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ONDINE_RELEASE: "1"
        run: dotnet run --project tests/Reindex.Tests

      - name: Guardar las notas de la versión
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  # ---------------------------------------------------------------------------
  # App de escritorio (WPF) + instalador. Solo Windows.
  # ---------------------------------------------------------------------------
  windows-instalador:
    needs: verificar-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # Que cada pantalla se construya y se mida sin reventar. Vive aquí y no en
      # el flujo de tests porque necesita Windows —WPF solo existe ahí— y los
      # ejecutores de Windows cuestan el doble de minutos: correrlo en cada push
      # se comería la cuota. Aquí se paga una vez, justo antes de publicar, que
      # es cuando de verdad importa que ninguna pantalla esté rota.
      - name: Humo de la interfaz (WPF)
        run: dotnet run --project tests/Ui.Smoke/Ui.Smoke.csproj -c Release

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      # La clave de TMDb se hornea AQUI, en la build oficial, desde un secreto
      # del repo. Si el secreto no existe la variable llega vacia y la app se
      # publica sin clave: arranca igual, la identificacion de peliculas queda
      # apagada y lo dice, y quien quiera usarla pone la suya en Preferencias.
      # Un fallo de build por una clave ausente seria peor que la funcion apagada.
      - name: Compilar instalador (icono + .exe self-contained + Inno)
        shell: pwsh
        env:
          ONDINE_TMDB_KEY: ${{ secrets.ONDINE_TMDB_KEY }}
        run: ./build.ps1

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: Ondine-Setup
          path: installer/Output/*.exe

      - name: Adjuntar al Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: installer/Output/*.exe

  # ---------------------------------------------------------------------------
  # Herramienta de terminal: multiplataforma de verdad.
  # ---------------------------------------------------------------------------
  cli:
    needs: verificar-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    rid: linux-x64,   nombre: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, nombre: linux-arm64 }
          - { os: macos-latest,     rid: osx-arm64,   nombre: macos-arm64 }
          # macOS Intel se compila de forma cruzada desde el runner ARM: los runners
          # macos-13 escasean y dejaban el job encolado más de 10 minutos.
          - { os: macos-latest,     rid: osx-x64,     nombre: macos-x64, cruzado: true }
          - { os: windows-latest,   rid: win-x64,     nombre: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Publicar binario autocontenido
        run: >
          dotnet publish src/Ondine.Cli/Ondine.Cli.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:DebugType=none
          -o publicado

      # Solo se puede ejecutar lo compilado para la propia arquitectura del runner.
      - name: Comprobar que arranca
        if: ${{ !matrix.cruzado }}
        shell: bash
        run: |
          BIN=publicado/ondine
          [[ -f "$BIN.exe" ]] && BIN="$BIN.exe"
          chmod +x "$BIN" || true
          "$BIN" version
          "$BIN" --help > /dev/null

      # Para el binario cruzado comprobamos al menos que es un Mach-O de x86_64.
      - name: Comprobar el formato del binario cruzado
        if: ${{ matrix.cruzado }}
        shell: bash
        run: |
          file publicado/ondine
          file publicado/ondine | grep -q "Mach-O 64-bit executable x86_64" \
            || { echo "::error::El binario no es un Mach-O x86_64"; exit 1; }

      # Windows: el .exe suelto (se descarga y se ejecuta, sin descomprimir).
      # Unix: .tar.gz, porque un fichero suelto pierde el permiso de ejecución al
      # descargarlo y daría «Permission denied»; el tar lo conserva.
      - name: Empaquetar
        shell: bash
        run: |
          cd publicado
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            mv ondine.exe "../ondine-${{ matrix.nombre }}.exe"
          else
            chmod +x ondine
            tar czf "../ondine-${{ matrix.nombre }}.tar.gz" ondine
          fi

      - name: Subir como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: ondine-${{ matrix.nombre }}
          path: |
            ondine-${{ matrix.nombre }}.exe
            ondine-${{ matrix.nombre }}.tar.gz
          if-no-files-found: error

      - name: Adjuntar al Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ondine-${{ matrix.nombre }}.exe
            ondine-${{ matrix.nombre }}.tar.gz

  # ---------------------------------------------------------------------------
  # Escritorio de Linux: el .deb para Mint, Ubuntu y Debian.
  #
  # Se monta EN Linux y no de forma cruzada desde Windows, aunque el script funcione desde
  # allí: dpkg-deb es de Debian, y montarlo en la misma familia en la que se va a instalar
  # quita de en medio los permisos y los finales de línea.
  #
  # No comprueba que la app ARRANQUE, y es a propósito: es gráfica y el runner no tiene
  # escritorio. Lo que sí comprueba es que el paquete está bien formado y que dentro está
  # lo que tiene que estar.
  # ---------------------------------------------------------------------------
  linux-escritorio:
    needs: verificar-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Montar el .deb
        run: |
          chmod +x empaquetado/linux/hacer-deb.sh
          ./empaquetado/linux/hacer-deb.sh

      # lintian es el revisor de paquetes de Debian. Se le pide que avise pero no que
      # falle: se queja de cosas que no aplican a una app autocontenida —páginas de
      # manual, changelog en su formato— y convertirlas en error obligaría a apagarlo
      # entero, que es peor que leer sus avisos.
      - name: Revisar el paquete
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lintian
          deb=$(ls empaquetado/salida/*.deb)
          echo "* $deb - $(du -h "$deb" | cut -f1)"
          dpkg-deb --info "$deb"
          lintian --no-tag-display-limit "$deb" || true

      # Que dentro está lo que tiene que estar. Sin esto, un paquete al que se le haya
      # caído el lanzador instala perfectamente y no sale en el menú.
      - name: Comprobar el contenido
        run: |
          deb=$(ls empaquetado/salida/*.deb)
          dpkg-deb --contents "$deb" > lista.txt
          for esperado in \
              ./opt/ondine/Ondine.Avalonia \
              ./usr/bin/ondine \
              ./usr/share/applications/ondine.desktop \
              ./usr/share/icons/hicolor/256x256/apps/ondine.png               ./usr/share/pixmaps/ondine.png; do
            grep -q "$esperado" lista.txt || { echo "::error::falta $esperado en el paquete"; exit 1; }
          done
          # Y que NO se ha colado libVLC de Windows, que ya pasó una vez: 283 MB que se
          # instalan y no usa nadie.
          if grep -qi "libvlc/win" lista.txt; then
            echo "::error::el paquete de Linux lleva binarios de libVLC de Windows dentro"
            exit 1
          fi
          echo "* el paquete lleva lo que tiene que llevar"

      - name: Subir como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: ondine-linux-deb
          path: empaquetado/salida/*.deb
          if-no-files-found: error

      - name: Adjuntar al Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: empaquetado/salida/*.deb

  # ---------------------------------------------------------------------------
  # El AppImage: un fichero, se marca ejecutable y se abre. Para probar Ondine sin
  # instalar nada y para las distribuciones que no son Debian.
  #
  # No comprueba que la app ARRANQUE -es grafica y el runner no tiene escritorio-, pero si
  # lo que hace que un AppImage no arranque: que dentro este el binario y que el lanzador
  # no apunte a /opt, que en un AppImage no existe.
  # ---------------------------------------------------------------------------
  linux-appimage:
    needs: verificar-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Montar el AppImage
        run: |
          chmod +x empaquetado/linux/hacer-appimage.sh
          ./empaquetado/linux/hacer-appimage.sh

      - name: Comprobar el contenido
        run: |
          # RUTA ABSOLUTA, y por eso esta escrito asi: mas abajo hay un «cd» -la extraccion
          # deja su carpeta en el directorio actual- y una ruta relativa deja de resolver en
          # cuanto se cambia de sitio. Se corto la v1.14.0 con esto mal: el AppImage se monto
          # perfectamente (46 MB) y fallo la comprobacion, que es el orden bueno para
          # equivocarse pero dejo la version sin ese paquete.
          img=$(ls "$PWD"/empaquetado/salida/*.AppImage)
          echo "* $img - $(du -h "$img" | cut -f1)"
          [ -x "$img" ] || { echo "::error::el AppImage no sale ejecutable"; exit 1; }

          # Se abre por dentro y se mira. --appimage-extract no necesita FUSE, que en el
          # contenedor del runner no hay.
          cd empaquetado/salida && "$img" --appimage-extract >/dev/null
          for esperado in \
              squashfs-root/AppRun \
              squashfs-root/ondine.desktop \
              squashfs-root/ondine.png \
              squashfs-root/usr/bin/Ondine.Avalonia; do
            [ -e "$esperado" ] || { echo "::error::falta $esperado dentro del AppImage"; exit 1; }
          done

          # El fallo que no da error: un Exec absoluto heredado del .deb. El AppImage se
          # monta igual de bien y al abrirlo no pasa nada.
          if grep -q "^Exec=/" squashfs-root/ondine.desktop; then
            echo "::error::el lanzador del AppImage apunta a una ruta absoluta"
            exit 1
          fi

          # Y que no se ha colado libVLC de Windows, como ya paso con el .deb.
          if find squashfs-root -ipath "*libvlc/win*" | grep -q .; then
            echo "::error::el AppImage lleva binarios de libVLC de Windows dentro"
            exit 1
          fi
          echo "* el AppImage lleva lo que tiene que llevar"

      - name: Subir como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: ondine-linux-appimage
          path: empaquetado/salida/*.AppImage
          if-no-files-found: error

      - name: Adjuntar al Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: empaquetado/salida/*.AppImage

  # ---------------------------------------------------------------------------
  # macOS: el .app dentro de un .dmg, uno por arquitectura.
  #
  # ESTE TRABAJO CUESTA DIEZ VECES MAS que los demas: GitHub factura los minutos de macOS
  # a x10. Por eso publica las dos arquitecturas en UN solo runner en vez de en dos en
  # paralelo, y por eso -como todo este flujo- solo corre en tag o a mano.
  #
  # Tiene que ser un Mac: iconutil, codesign y hdiutil son de macOS. La publicacion de .NET
  # si se puede hacer desde cualquier sistema; el envoltorio no.
  # ---------------------------------------------------------------------------
  macos-dmg:
    needs: verificar-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Montar los .dmg
        run: |
          chmod +x empaquetado/macos/hacer-dmg.sh
          ./empaquetado/macos/hacer-dmg.sh

      - name: Comprobar los paquetes
        run: |
          cuantos=$(ls empaquetado/salida/*.dmg | wc -l | tr -d ' ')
          [ "$cuantos" = "2" ] || { echo "::error::salen $cuantos .dmg y tienen que ser 2 (arm64 e Intel)"; exit 1; }

          for dmg in empaquetado/salida/*.dmg; do
            echo "* $dmg - $(du -h "$dmg" | cut -f1)"
            punto=$(mktemp -d)
            hdiutil attach -quiet -nobrowse -mountpoint "$punto" "$dmg"

            app="$punto/Ondine.app"
            [ -d "$app" ] || { echo "::error::$dmg no lleva Ondine.app dentro"; hdiutil detach -quiet "$punto"; exit 1; }
            [ -x "$app/Contents/MacOS/Ondine.Avalonia" ] || { echo "::error::el binario no esta o no es ejecutable"; hdiutil detach -quiet "$punto"; exit 1; }

            # La firma ad hoc. Sin ella, en los Mac con chip de Apple la app se cierra al
            # abrirse y no hay mensaje que lo explique.
            codesign --verify --deep "$app" || { echo "::error::$dmg va sin firmar"; hdiutil detach -quiet "$punto"; exit 1; }

            # Que el ejecutable declarado es el que esta. Un nombre que no cuadra da un
            # bundle perfecto que al abrirse no hace nada.
            declarado=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
            [ "$declarado" = "Ondine.Avalonia" ] || { echo "::error::el Info.plist declara $declarado"; hdiutil detach -quiet "$punto"; exit 1; }

            hdiutil detach -quiet "$punto"
          done
          echo "* los dos paquetes llevan lo que tienen que llevar"

      - name: Subir como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: ondine-macos-dmg
          path: empaquetado/salida/*.dmg
          if-no-files-found: error

      - name: Adjuntar al Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: empaquetado/salida/*.dmg

  # ---------------------------------------------------------------------------
  # Notas de la Release tomadas del CHANGELOG (el contrato garantiza que existen).
  # ---------------------------------------------------------------------------
  notas:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-instalador, cli, linux-escritorio, linux-appimage, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Publicar notas
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
