    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #161826;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>

  <body>
    <!-- ── Ondine · spot vertical (9:16) ──────────────────────────────────────────
         La misma pieza y la misma pista que el horizontal: 93 BPM, compás de 2,5806 s,
         17 compases = 43,870 s. Cada plano cae en el mismo instante que su gemelo
         apaisado, así que la sincronía con la música es idéntica.

         Lo que cambia es el encuadre, y no por recorte: cada plano está recompuesto.
         En 9:16 el eje largo es el vertical, así que lo que en apaisado se ponía en
         paralelo (página y panel, las dos piezas del corte, el antes y el después)
         aquí se apila. Y todo pierde detalle a propósito: esto se ve en un móvil,
         normalmente sin sonido y de paso.

         Franja segura para Stories: el contenido vive entre y=280 y y=1640; fuera de
         ahí la interfaz de Instagram se come lo que haya. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="43.870"
      data-width="1080"
      data-height="1920"
      data-fps="60"
    >
      <div

    <script>
