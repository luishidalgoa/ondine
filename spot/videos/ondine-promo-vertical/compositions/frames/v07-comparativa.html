              '<div class="cm-cap-mini-fade"></div>' +
              '<div class="cm-cap-mini-play">' + PLAY_MINI + "</div>" +
              '<span class="cm-cap-dur">' + c[2].split(" · ")[0] + "</span>"
            : '<div class="cm-vacia">' + FILM(46) + "</div>" +
              '<span class="cm-cap-dur">' + c[2].split(" · ")[0] + "</span>";
          const texto = real
            ? '<span class="cm-cap-tit" id="' + id + '-cap-tit-' + i + '">' + c[0] + ". " + c[1] + "</span>" +
              '<span class="cm-cap-meta">' + c[2] + "</span>" +
              '<span class="cm-cap-sin">' + c[3] + "</span>"
            : '<span class="cm-crudo">' + CRUDOS[i] + "</span>" +
              '<span class="cm-crudo-meta">' + c[2].split(" · ")[0] + "</span>";
          return '<div class="cm-cap"><div class="cm-cap-mini">' + mini + "</div>" +
                 '<div class="cm-cap-txt">' + texto + "</div></div>";
        }).join("");

        const serie = real
          ? '<span class="cm-serie-tit">Aquí no hay quien viva</span>' +
            '<div class="cm-serie-meta"><span>Temporada 2</span><span>·</span>' +
            "<span>13 episodios</span><span>·</span><span>2004</span></div>" + BOTONERA
          : '<span class="cm-serie-crudo">' + CARPETA + "</span>" +
            '<div class="cm-serie-meta"><span>12 vídeos</span></div>' + BOTONERA;

        return '<div class="cm-telon"><div class="cm-telon-fondo"></div>' +
          (real ? '<div class="cm-telon-arte" data-layout-allow-overflow></div>' : "") +
          '<div class="cm-telon-fade"></div></div>' + BARRA +
          '<div class="cm-visor"><div class="cm-scroll" id="' + id + '-scroll">' +
          '<div class="cm-cabecera"><div class="cm-portada">' +
          (real ? '<div class="cm-portada-arte"></div>'
                : '<div class="cm-vacia">' + FILM(76) + "</div>" +
                  '<span class="cm-portada-nombre">' + CARPETA + "</span>") +
          '</div><div class="cm-serie">' + serie + "</div></div>" +
          '<div class="cm-capitulos">' + capitulos + "</div></div></div>";
      };

      document.getElementById("cm-antes").innerHTML = biblioteca("cm-antes", false);
      document.getElementById("cm-despues").innerHTML = biblioteca("cm-despues", true);

      const tl = gsap.timeline({ paused: true });

      // ── Compás 1 · la pantalla se resuelve entera ──────────────────────────
      tl.to("#cm-biblios",
        { filter: "blur(0px)", opacity: 1, duration: 2.38, ease: EASE_OUT }, 0.02);
      tl.to("#cm-win-despues", { opacity: 1, duration: 1.8, ease: EASE_OUT }, 0.5);

      // ── Compás 2 · la comparación ──────────────────────────────────────────
      // El antes sube a la mitad de arriba y el después baja a la de abajo. Cada mitad
      // recorta 960 px, y el después se desplaza justo esos 960 para que las dos
      // enseñen las MISMAS filas.
      const SPLIT = 0.86;
      tl.fromTo("#cm-win-antes", { clipPath: "inset(0 0 0 0)" },
        { clipPath: "inset(0 0 50% 0)", duration: SPLIT, ease: EASE_IN_OUT,
          immediateRender: false }, 2.58);
      tl.fromTo("#cm-win-despues", { clipPath: "inset(0 0 0 0)" },
        { clipPath: "inset(50% 0 0 0)", duration: SPLIT, ease: EASE_IN_OUT,
          immediateRender: false }, 2.58);
      tl.fromTo("#cm-antes", { y: 240 },
        { y: 120, duration: SPLIT, ease: EASE_IN_OUT, immediateRender: false }, 2.58);
      tl.fromTo("#cm-despues", { y: 240 },
        { y: 1080, duration: SPLIT, ease: EASE_IN_OUT, immediateRender: false }, 2.58);
      tl.fromTo("#cm-divisor", { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: EASE_OUT, immediateRender: false }, 2.9);

      tl.to(["#cm-scrim-a", "#cm-scrim-d"], { opacity: 1, duration: 0.4, ease: EASE_OUT }, 3.3);
      tl.fromTo("#cm-pie-antes", { y: -16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.22, ease: EASE_OUT, immediateRender: false }, 3.4);
      tl.fromTo("#cm-pie-despues", { y: -16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.22, ease: EASE_OUT, immediateRender: false }, 3.48);

      // Las dos mitades se desplazan A LA VEZ y con el mismo valor: es lo único que
      // hace que la comparación sea una comparación.
      tl.fromTo(["#cm-antes-scroll", "#cm-despues-scroll"], { y: 0 },
        { y: -1240, duration: 10.3, ease: "none", immediateRender: false }, 2.6);

      [4.05, 4.53, 5.02].forEach((t, i) => {
        tl.to("#cm-despues-cap-tit-" + i, { color: "#e9e9ed", duration: 0.2, ease: EASE_OUT }, t);
        tl.to("#cm-despues-cap-tit-" + i, { color: "#c9ccd6", duration: 0.2, ease: EASE_OUT }, t + 0.2);
      });

      // ── Compás 4 · «Optimiza tus bibliotecas…» ─────────────────────────────
      tl.to("#cm-velo",
        { "--centro": 0.72, "--borde": 0.82, duration: 0.7, ease: EASE_IN_OUT }, 5.05 + C);
      const wOpt = [];
      document.querySelectorAll("#cm-optimiza .cm-linea")
        .forEach((l) => palabras(l).forEach((w) => wOpt.push(w)));
      tl.to(wOpt, { opacity: 1, duration: 0.26, ease: EASE_OUT, stagger: 0.06 }, 5.2 + C);
      metalizar(document.getElementById("cm-optimiza"), wOpt);
      barrer(document.getElementById("cm-optimiza"), 5.2 + C);

      tl.to([".cm-pie", "#cm-divisor", "#cm-scrim-a", "#cm-scrim-d"],
        { opacity: 0, duration: 0.4, ease: EASE_IN }, 5.05 + C);

      tl.to("#cm-optimiza",
        { y: -28, filter: "blur(10px)", opacity: 0, duration: 0.32, ease: EASE_IN }, 7.1 + C);

      // ── Compás 5 · cierre y bucle ──────────────────────────────────────────
      tl.fromTo("#cm-marca", { scale: 0.96 },
        { scale: 1, duration: SPRING_DUR, ease: SPRING, immediateRender: false }, 7.74 + C);
      tl.fromTo("#cm-marca", { opacity: 0 },
        { opacity: 1, duration: 0.26, ease: EASE_OUT, immediateRender: false }, 7.74 + C);
      tl.to("#cm-velo",
        { "--centro": 0.86, "--borde": 0.9, duration: 0.66, ease: EASE_IN_OUT }, 7.74 + C);

      // kinetic-center-build. El +0,05 em de partida va en `x` por carácter, no en
      // `letter-spacing`: esa propiedad reflowa el texto y el motor de captura lo acusa
      // como tirones.
      const wFrase = [];
      document.querySelectorAll("#cm-frase .cm-linea")
        .forEach((l) => palabras(l).forEach((w) => wFrase.push(w)));
      const SEP = 76 * 0.05;
      const letras = [];
      wFrase.forEach((w) => {
        const chars = [...w.textContent].map((c) => {
          const sp = document.createElement("span");
          sp.className = "ch";
          sp.textContent = c;
          return sp;
        });
        w.textContent = "";
        chars.forEach((c) => { w.appendChild(c); letras.push({ el: c, palabra: w }); });
      });

      metalizar(document.getElementById("cm-frase"), letras.map((l) => l.el));
      barrer(document.getElementById("cm-frase"), 8.8 + C);

      const medio = (letras.length - 1) / 2;
      const centro = (wFrase.length - 1) / 2;
      wFrase.forEach((w, i) => {
        const anillo = Math.round(Math.abs(i - centro));
        const at = 8.8 + C + anillo * 0.07;
        tl.fromTo(w, { opacity: 0, scale: 1.05 },
          { opacity: 1, scale: 1, duration: 0.32, ease: EASE_OUT, immediateRender: false }, at);
        letras.forEach((l, k) => {
          if (l.palabra !== w) return;
          tl.fromTo(l.el, { x: (k - medio) * SEP },
            { x: 0, duration: 0.32, ease: EASE_OUT, immediateRender: false }, at);
        });
      });

      [0, 1, 2, 3].forEach((i) => {
        tl.fromTo("#cm-compat-" + i, { y: -16, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.22, ease: EASE_OUT, immediateRender: false },
          9.6 + C + i * 0.07);
      });
      tl.to("#cm-velo",
        { "--centro": 0.9, "--borde": 0.94, duration: 0.42, ease: EASE_IN_OUT }, 9.6 + C);

      tl.to("#cm-velo",
        { "--centro": 1, "--borde": 1, duration: 0.3, ease: EASE_IN_OUT }, 10.02 + C);

      window.__timelines = window.__timelines || {};
      window.__timelines["v07-comparativa"] = tl;
    })();
  </script>
</template>
