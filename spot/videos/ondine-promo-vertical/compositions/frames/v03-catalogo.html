  <script>
    (() => {
      const DUR = 7.742;
      const T0 = 1.29;

      const cb = (x1, y1, x2, y2) => {
        const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
        const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
        return (p) => {
          if (p <= 0) return 0;
          if (p >= 1) return 1;
          let t = p;
          for (let i = 0; i < 8; i++) {
            const e = ((ax * t + bx) * t + cx) * t - p;
            if (Math.abs(e) < 1e-6) break;
            const d = (3 * ax * t + 2 * bx) * t + cx;
            if (Math.abs(d) < 1e-6) break;
            t -= e / d;
          }
          return ((ay * t + by) * t + cy) * t;
        };
      };
      const EASE_OUT = cb(0.16, 1, 0.3, 1);
      const EASE_IN = cb(0.7, 0, 0.84, 0);
      const EASE_IN_OUT = cb(0.65, 0, 0.35, 1);
      const SNAP = cb(0.34, 1.2, 0.64, 1);
      const SPRING_DUR = 0.6;
      const SPRING = (p) => {
        if (p >= 1) return 1;
        const t = p * SPRING_DUR;
        return 1 - Math.exp(-11 * t) * (Math.cos(9.43 * t) + (11 / 9.43) * Math.sin(9.43 * t));
      };

      const palabras = (el) => {
        const txt = el.textContent;
        el.textContent = "";
        const out = [];
        txt.split(/(\s+)/).forEach((tk) => {
          if (!tk) return;
          if (/^\s+$/.test(tk)) { el.appendChild(document.createTextNode(tk)); return; }
          const sp = document.createElement("span");
          sp.className = "w";
          sp.textContent = tk;
          el.appendChild(sp);
          out.push(sp);
        });
        return out;
      };

      const TEJA = 1600;
      const metalizar = (caja, piezas) => {
        const x0 = caja.getBoundingClientRect().left;
        piezas.forEach((p) => {
          p.classList.add("metal");
          const dx = Math.round(p.getBoundingClientRect().left - x0);
          p.style.backgroundPositionX = "calc(var(--barrido) - " + dx + "px)";
        });
      };
      const barrer = (caja, desde) => {
        tl.fromTo(caja, { "--barrido": "0px" },
          { "--barrido": TEJA + "px", duration: 7, ease: "none", immediateRender: false }, desde);
      };

      // ── Contenido ──────────────────────────────────────────────────────────
      const EPISODIOS = [
        ["4", "Érase una okupa", "16 abr 2004"],
        ["5", "Érase un ascensor", "23 abr 2004"],
        ["6", "Érase un vecino nuevo", "30 abr 2004"],
        ["7", "Érase una mudanza", "7 may 2004"],
        ["8", "Érase un cumpleaños", "14 may 2004"],
        ["9", "Érase una portera", "21 may 2004"],
        ["10", "Érase un okupa más", "28 may 2004"],
      ];
      document.getElementById("ct-tabla-filas").innerHTML = EPISODIOS.map((e, i) =>
        '<div class="ct-fila" style="background:' + (i % 2 ? "#f6f6fa" : "#fbfbfd") + '">' +
        '<span class="ct-col-n">' + e[0] + "</span>" +
        '<span class="ct-col-t">' + e[1] + "</span>" +
        '<span class="ct-col-f">' + e[2] + "</span></div>").join("");

      const CODIGO = [
        '{ "formato": "reindex/1.0", "serie": "Aquí no hay..." }',
        '{ "num": 4, "temp": 2, "titulo": "Érase una okupa" }',
        '{ "num": 5, "temp": 2, "titulo": "Érase un ascensor" }',
        '{ "num": 6, "temp": 2, "titulo": "Érase un vecino..." }',
      ];
      document.getElementById("ct-codigo-cuerpo").innerHTML = CODIGO.map((txt, i) =>
        '<div class="ct-linea-cod" id="ct-linea-' + i + '">' +
        '<span class="ct-linea-n">' + String(i + 1).padStart(2, "0") + "</span>" +
        '<span class="ct-linea-cuerpo">' +
        '<span class="ct-linea-txt" id="ct-txt-' + i + '">' + txt + "</span>" +
        '<span class="ct-linea-caret" data-layout-allow-overlap id="ct-caret-' + i + '">▌</span>' +
        "</span></div>").join("");

      document.getElementById("ct-seleccion").style.width =
        (document.getElementById("ct-url").offsetWidth + 6) + "px";

      const tl = gsap.timeline({ paused: true });

      // ── Compás de entrada ──────────────────────────────────────────────────
      const wIntro = [];
      document.querySelectorAll("#ct-intro-txt .ct-linea")
        .forEach((l) => palabras(l).forEach((w) => wIntro.push(w)));
      tl.to(wIntro, { opacity: 1, duration: 0.26, ease: EASE_OUT, stagger: 0.06 }, 0.06);
      metalizar(document.getElementById("ct-intro-txt"), wIntro);
      barrer(document.getElementById("ct-intro-txt"), 0.06);

      tl.to("#ct-intro-txt",
        { y: -28, filter: "blur(10px)", opacity: 0, duration: 0.32, ease: EASE_IN }, 0.9);
      tl.to("#ct-intro-velo", { opacity: 0, duration: 0.39, ease: EASE_IN_OUT }, 0.9);
      tl.to("#ct-pagina", { filter: "blur(0px)", duration: 0.42, ease: EASE_OUT }, 0.9);

      // ── El clip ────────────────────────────────────────────────────────────
      tl.fromTo("#ct-kicker", { x: -18, opacity: 0 },
        { x: 0, opacity: 0.55, duration: 0.22, ease: EASE_OUT, immediateRender: false }, T0);
      tl.to("#ct-kicker", { opacity: 1, duration: 0.24, ease: EASE_OUT }, T0 + 2.76);

      // El panel espera fuera de cuadro, por abajo.
      tl.set("#ct-panel", { y: 1320, scale: 0.96 }, 0);
      tl.set("#ct-cursor", { x: 860, y: 1560 }, 0);
      tl.to("#ct-cursor", { opacity: 1, duration: 0.18, ease: EASE_OUT }, T0);

      // 0,50 · el cursor llega a la barra de direcciones.
      tl.to("#ct-cursor", { x: 400, y: 352, duration: 0.42, ease: EASE_IN_OUT }, T0 + 0.5);
      tl.to("#ct-cursor", { scale: 0.88, duration: 0.06, ease: SNAP }, T0 + 1.13);
      tl.to("#ct-cursor", { scale: 1, duration: 0.06, ease: SNAP }, T0 + 1.19);

      // 1,52 · la URL se selecciona de un barrido. Es lo que se copia.
      tl.fromTo("#ct-seleccion", { scaleX: 0 },
        { scaleX: 1, duration: 0.24, ease: EASE_OUT, immediateRender: false }, T0 + 1.52);

      // 2,11 · relevo por el eje vertical: la página se va por arriba y el panel sube.
      tl.to("#ct-pagina",
        { y: -420, filter: "blur(8px)", opacity: 0.4, duration: 0.49, ease: EASE_IN }, T0 + 2.11);
      tl.to("#ct-panel", { y: 0, opacity: 1, duration: 0.49, ease: EASE_OUT }, T0 + 2.11);

      tl.fromTo("#ct-campo-txt", { x: -18, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.22, ease: EASE_OUT, immediateRender: false }, T0 + 2.11);
      tl.to("#ct-campo-txt", { color: "#e9e9ed", duration: 0.2, ease: EASE_OUT }, T0 + 2.11);
      tl.to("#ct-campo", { borderColor: "#968ae0", duration: 0.2, ease: EASE_OUT }, T0 + 2.11);

      // El cursor cruza al botón para que el golpe del 2,76 tenga autor. Con el panel a
      // escala 0,96 y origen arriba, el botón cae en (540, 602) del lienzo.
      tl.to("#ct-cursor", { x: 540, y: 602, duration: 0.42, ease: EASE_IN_OUT }, T0 + 2.3);

      // 2,76 · el golpe.
      tl.to("#ct-boton", { scale: 0.97, duration: 0.06, ease: SNAP }, T0 + 2.76);
      tl.to("#ct-boton", { scale: 1, duration: 0.06, ease: SNAP }, T0 + 2.82);
      tl.to("#ct-boton",
        { backgroundColor: "#968ae0", borderColor: "#968ae0", color: "#161826", duration: 0.09, ease: EASE_OUT },
        T0 + 2.76);
      tl.to("#ct-cursor", { scale: 0.88, duration: 0.06, ease: SNAP }, T0 + 2.76);
      tl.to("#ct-cursor", { scale: 1, duration: 0.06, ease: SNAP }, T0 + 2.82);
      tl.fromTo("#ct-halo", { opacity: 0.18 },
        { opacity: 0, duration: 0.3, ease: EASE_OUT, immediateRender: false }, T0 + 2.76);

      tl.to("#ct-pagina",
        { y: -1700, opacity: 0, filter: "blur(14px)", duration: 0.4, ease: EASE_IN }, T0 + 2.76);

      // 3,00 · el único movimiento de cámara. En apaisado el panel viajaba al borde del
      // lienzo; aquí ya lo ocupa, así que la cámara empuja: crece hacia abajo y el
      // bloque de código gana presencia justo cuando va a escribirse.
      tl.to("#ct-panel", { scale: 1, duration: 0.52, ease: EASE_IN_OUT }, T0 + 3.0);
      tl.to("#ct-cursor", { opacity: 0, duration: 0.3, ease: EASE_IN }, T0 + 3.0);

      tl.to("#ct-boton",
        { backgroundColor: "rgba(0,0,0,0)", borderColor: "#5d5294", color: "#8a8fa3", duration: 0.3, ease: EASE_OUT },
        T0 + 3.4);
      tl.to("#ct-campo", { borderColor: "#33364a", duration: 0.3, ease: EASE_OUT }, T0 + 3.4);
      tl.to("#ct-campo-txt", { color: "#8a8fa3", duration: 0.3, ease: EASE_OUT }, T0 + 3.4);

      // ── El catálogo se escribe solo · una línea por golpe ──────────────────
      const GOLPES = [T0 + 3.4, T0 + 4.05, T0 + 4.52, T0 + 5.0];
      const FIN = T0 + 5.9;

      CODIGO.forEach((txt, i) => {
        const at = GOLPES[i];
        const hueco = (i + 1 < GOLPES.length ? GOLPES[i + 1] : FIN) - at;
        const dur = Math.min(txt.length * 0.022, hueco - 0.08);
        const pasos = txt.length;

        tl.fromTo("#ct-linea-" + i, { y: -16, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.22, ease: EASE_OUT, immediateRender: false }, at);
        tl.fromTo("#ct-txt-" + i,
          { clipPath: "inset(0 100% 0 0)" },
          { clipPath: "inset(0 0% 0 0)", duration: dur, ease: "steps(" + pasos + ")",
            immediateRender: false }, at);

        const ancho = document.getElementById("ct-txt-" + i).offsetWidth;
        tl.set("#ct-caret-" + i, { opacity: 1 }, at);
        tl.fromTo("#ct-caret-" + i, { x: 0 },
          { x: ancho, duration: dur, ease: "steps(" + pasos + ")", immediateRender: false }, at);
        const hasta = i + 1 < GOLPES.length ? GOLPES[i + 1] : DUR;
        const ciclos = Math.max(1, Math.ceil((hasta - at - dur) / 0.5));
        tl.to("#ct-caret-" + i,
          { opacity: 0, duration: 0.25, repeat: ciclos * 2, yoyo: true, ease: "none" }, at + dur);
        tl.set("#ct-caret-" + i, { opacity: 0 },
          i + 1 < GOLPES.length ? GOLPES[i + 1] : DUR - 0.001);
      });

      // 5,30 · la cifra aterriza y cuenta hasta 24 en lineal.
      tl.fromTo("#ct-contador", { scale: 0.94 },
        { scale: 1, duration: SPRING_DUR, ease: SPRING, immediateRender: false }, T0 + 5.3);
      tl.fromTo("#ct-contador", { opacity: 0 },
        { opacity: 1, duration: 0.26, ease: EASE_OUT, immediateRender: false }, T0 + 5.3);
      const cifra = { v: 0 };
      tl.to(cifra, {
        v: 24, duration: 0.6, ease: "none",
        onUpdate: () => {
          document.getElementById("ct-contador-n").textContent = String(Math.round(cifra.v));
        },
      }, T0 + 5.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["v03-catalogo"] = tl;
    })();
  </script>
</template>
