  <script>
    (() => {
      const cb = (x1, y1, x2, y2) => {
        const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
        const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
        return (p) => {
          if (p <= 0) return 0;
          if (p >= 1) return 1;
          let t = p;
          for (let i = 0; i < 8; i++) {
            const e = ((ax * t + bx) * t + cx) * t - p;
            if (Math.abs(e) < 1e-6) break;
            const d = (3 * ax * t + 2 * bx) * t + cx;
            if (Math.abs(d) < 1e-6) break;
            t -= e / d;
          }
          return ((ay * t + by) * t + cy) * t;
        };
      };
      const EASE_OUT = cb(0.16, 1, 0.3, 1);
      const EASE_IN = cb(0.7, 0, 0.84, 0);
      const SPRING_DUR = 0.6;
      const SPRING = (p) => {
        if (p >= 1) return 1;
        const t = p * SPRING_DUR;
        return 1 - Math.exp(-11 * t) * (Math.cos(9.43 * t) + (11 / 9.43) * Math.sin(9.43 * t));
      };

      const palabras = (el) => {
        const txt = el.textContent;
        el.textContent = "";
        const out = [];
        txt.split(/(\s+)/).forEach((tk) => {
          if (!tk) return;
          if (/^\s+$/.test(tk)) { el.appendChild(document.createTextNode(tk)); return; }
          const sp = document.createElement("span");
          sp.className = "w";
          sp.textContent = tk;
          el.appendChild(sp);
          out.push(sp);
        });
        return out;
      };

      // UNA sola secuencia de dieciséis tonos partida en dos ochos: con el fichero
      // entero en pantalla, dos series distintas delatarían la junta antes de tiempo.
      const TONOS = [
        "#1A1C2E", "#242844", "#2C2A4A", "#1E2236", "#262B48", "#191C2C", "#2A2E4C", "#212539",
        "#1D2032", "#2A2E4A", "#22263C", "#2E3254", "#1B1E30", "#272B46", "#202438", "#2C3050",
      ];
      [0, 1].forEach((p) => {
        const tiras = TONOS.slice(p * 8, p * 8 + 8).map((c) =>
          '<div class="cr-tira" style="background:' + c + '"></div>').join("");
        document.getElementById("cr-tiras-" + p).insertAdjacentHTML("afterbegin", tiras);
      });

      const tl = gsap.timeline({ paused: true });

      // 0,00 → 0,50 · el fichero entero. El drop lo recoge su llegada: corte seco desde
      // el plano anterior a un bloque que ocupa el ancho del lienzo.

      // 0,50 · EL TAJO, en tres tiempos. El fogonazo se va rápido, el halo lo sostiene
      // y el filo es el último en irse: así se apaga una chispa.
      tl.fromTo("#cr-fogonazo", { opacity: 1 },
        { opacity: 0, duration: 0.22, ease: EASE_IN, immediateRender: false }, 0.5);
      tl.fromTo("#cr-tajo-halo", { opacity: 1 },
        { opacity: 0, duration: 0.36, ease: EASE_IN, immediateRender: false }, 0.5);
      tl.fromTo("#cr-tajo", { opacity: 1 },
        { opacity: 0, duration: 0.46, ease: EASE_IN, immediateRender: false }, 0.54);

      // En el mismo fotograma aparece el filo interior de cada pieza: hasta aquí eran
      // un bloque, a partir de aquí son dos ficheros.
      tl.set("#cr-tiras-0",
        { borderBottomLeftRadius: 12, borderBottomRightRadius: 12, borderBottomWidth: 1 }, 0.5);
      tl.set("#cr-tiras-1",
        { borderTopLeftRadius: 12, borderTopRightRadius: 12, borderTopWidth: 1 }, 0.5);

      // 0,50 → 1,14 · las piezas abren hasta los 88 px de hueco.
      tl.fromTo("#cr-pieza-0", { y: 44 },
        { y: 0, duration: 0.64, ease: EASE_OUT, immediateRender: false }, 0.5);
      tl.fromTo("#cr-pieza-1", { y: -44 },
        { y: 0, duration: 0.64, ease: EASE_OUT, immediateRender: false }, 0.5);

      // 1,14 · el nombre de origen se tacha y se apaga.
      tl.fromTo("#cr-origen-tachon", { scaleX: 0 },
        { scaleX: 1, duration: 0.24, ease: EASE_OUT, immediateRender: false }, 1.14);
      tl.to("#cr-origen", { color: "#4a4f63", duration: 0.3, ease: EASE_OUT }, 1.14);

      // 1,79 · las dos píldoras, juntas: etiquetar las dos piezas es UN suceso.
      [0, 1].forEach((i) => {
        const t = 1.79 + i * 0.08;
        tl.fromTo("#cr-pildora-" + i, { scale: 1.15 },
          { scale: 1, duration: SPRING_DUR, ease: SPRING, immediateRender: false }, t);
        tl.fromTo("#cr-pildora-" + i, { opacity: 0 },
          { opacity: 1, duration: 0.26, ease: EASE_OUT, immediateRender: false }, t);
      });

      // 2,60 y 3,08 · los rangos.
      [2.6, 3.08].forEach((t, i) => {
        tl.fromTo("#cr-rango-" + i, { x: 18, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.22, ease: EASE_OUT, immediateRender: false }, t);
      });

      // 3,73 y 4,37 · la carga útil del plano. El stagger de 90 ms de la guía está
      // pensado para frases cortas; un nombre de fichero son once palabras, así que se
      // comprime para no invadir el golpe siguiente ni comerse la quietud del final.
      [{ t: 3.73, ventana: 0.64 }, { t: 4.37, ventana: 0.79 }].forEach((n, i) => {
        tl.fromTo("#cr-nombre-" + i, { y: -16, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.22, ease: EASE_OUT, immediateRender: false }, n.t);

        const ws = [];
        document.querySelectorAll("#cr-nombre-" + i + " .cr-nombre-l")
          .forEach((l) => palabras(l).forEach((w) => ws.push(w)));

        const paso = Math.min(0.09, (n.ventana - 0.34) / Math.max(1, ws.length - 1));
        const ult = ws.length - 1;
        ws.forEach((w, j) => {
          tl.fromTo(w,
            { opacity: 0, scale: 1 + 0.06 * (1 - j / ult), filter: "blur(3px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.34, ease: EASE_OUT,
              immediateRender: false },
            n.t + j * paso);
        });
      });

      tl.to("#cr-origen", { opacity: 0.7, duration: 0.3, ease: EASE_OUT }, 3.73);

      window.__timelines = window.__timelines || {};
      window.__timelines["v06-corte"] = tl;
    })();
  </script>
