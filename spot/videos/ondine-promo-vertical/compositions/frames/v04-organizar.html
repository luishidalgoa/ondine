          <span id="og-n-ok">0</span>

        </div>

  <style>

    }

    }

    /* 22 px: el nombre propuesto más largo son 57 caracteres y a este cuerpo mide

    }

    /* ── el overlay de cierre ──────────────────────────────────────────────── */
    #og-overlay {
      position: absolute;
      inset: 0;
      overflow: hidden;

    #og-frase {
      --barrido: 0px;

      font-size: 82px;

      color: #e9e9ed;
      text-align: center;
      max-width: 940px;
    }

    .og-linea { display: block; }
    #og-frase .w { display: inline-block; opacity: 0; }

    .metal {
      color: transparent;
      -webkit-text-fill-color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      background-image: linear-gradient(to right,
        #b9bec9 0%, #e8ebf0 9%, #c6cbd5 17%, #f6f8fb 31%, #d2d7e0 38%,
        #aeb4bf 52%, #eef1f5 61%, #c1c6d1 73%, #e2e6ec 84%, #b9bec9 100%);
      background-size: 1600px 100%;
      background-repeat: repeat;
    }
  </style>

  <script>
    (() => {
      // Este plano cae dentro del bajón. Una sola curva LINEAR: ni curvas nombradas,
      // ni muelles, ni destellos.
      const LINEAR = "none";

      const GRUPOS = [
        ["TEMPORADA 1", [
          ["Cap 12 (2).mkv", "Aqui no hay quien viva - S01E12 - Érase un portal"],
          ["episodio final BUENO.mkv", "Aqui no hay quien viva - S01E13 - Érase un final"],
          ["Sin titulo (copia).mkv", "Aqui no hay quien viva - S01E09 - Érase una portera"],
          ["cap14.mkv", "Aqui no hay quien viva - S01E14 - Érase una boda"],
        ]],
        ["TEMPORADA 2", [
          ["Temporada2_04.mkv", "Aqui no hay quien viva - S02E04 - Érase una okupa"],
          ["Temporada2_05.mkv", "Aqui no hay quien viva - S02E05 - Érase un ascensor"],
          ["aqui no hay quien viva 3x07.avi", "Aqui no hay quien viva - S02E07 - Érase una mudanza"],
          ["nuevo_cap (1).mkv", "Aqui no hay quien viva - S02E08 - Érase un cumpleaños"],
        ]],
      ];

      const CHECK =
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5DB872" ' +
        'stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M4 13l5 5L20 6"></path></svg>';

      let n = 0;
      document.getElementById("og-tabla").innerHTML = GRUPOS.map((g) =>
        '<div><div class="og-grupo-cab">' +
        '<span class="og-grupo-nom">' + g[0] + "</span>" +
        '<div class="og-grupo-linea"></div></div>' +
        g[1].map((par) => {
          const i = n++;
          return '<div class="og-fila"><div class="og-nombres">' +
            '<span class="og-original">' + par[0] + "</span>" +
            '<span class="og-propuesta" id="og-prop-' + i + '">' + par[1] + ".mkv</span>" +
            "</div>" +
            '<div class="og-pildora-hueco"><div class="og-pildora" id="og-pild-' + i + '">' +
            CHECK + "<span>Correcto</span></div></div></div>";
        }).join("") + "</div>").join("");

      const tl = gsap.timeline({ paused: true });

      // 0,00 → 1,52 · las píldoras en cascada. Fundido y 6 px de subida, sin escala.
      for (let i = 0; i < n; i++) {
        const at = i * 0.19;
        tl.fromTo("#og-pild-" + i, { y: 6, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.19, ease: LINEAR }, at);
        tl.to("#og-prop-" + i, { color: "#e9e9ed", duration: 0.19, ease: LINEAR }, at);
      }

      // 0,00 → 3,90 · el contador sube en lineal, sin aceleración final.
      const ok = { v: 0 };
      const nOk = document.getElementById("og-n-ok");
      tl.to(ok, {
        v: 246, duration: 3.9, ease: LINEAR,
        onUpdate: () => { nOk.textContent = String(Math.round(ok.v)); },
      }, 0);
      tl.to("#og-n-ok", { color: "#8a8fa3", duration: 1.95, ease: LINEAR }, 0);
      tl.to("#og-n-ok", { color: "#5db872", duration: 1.95, ease: LINEAR }, 1.95);

      // 3,90 · el velo se cierra y entra la frase. Lineal también aquí.
      tl.to("#og-velo", { opacity: 1, duration: 0.5, ease: LINEAR }, 3.9);

      const palabras = (el) => {
        const txt = el.textContent;
        el.textContent = "";
        const out = [];
        txt.split(/(\s+)/).forEach((tk) => {
          if (!tk) return;
          if (/^\s+$/.test(tk)) { el.appendChild(document.createTextNode(tk)); return; }
          const sp = document.createElement("span");
          sp.className = "w";
          sp.textContent = tk;
          el.appendChild(sp);
          out.push(sp);
        });
        return out;
      };
      const wFrase = [];
      document.querySelectorAll("#og-frase .og-linea")
        .forEach((l) => palabras(l).forEach((w) => wFrase.push(w)));
      tl.to(wFrase, { opacity: 1, duration: 0.26, ease: LINEAR, stagger: 0.06 }, 4.06);

      const TEJA = 1600;
      const caja = document.getElementById("og-frase");
      const x0 = caja.getBoundingClientRect().left;
      wFrase.forEach((p) => {
        p.classList.add("metal");
        const dx = Math.round(p.getBoundingClientRect().left - x0);
        p.style.backgroundPositionX = "calc(var(--barrido) - " + dx + "px)";
      });
      tl.fromTo(caja, { "--barrido": "0px" },
        { "--barrido": TEJA + "px", duration: 7, ease: "none", immediateRender: false }, 4.06);

      // 4,62 → 5,16 · quietud. El plano sigue acabando en silencio, ahora con la frase.

      window.__timelines = window.__timelines || {};
      window.__timelines["v04-organizar"] = tl;
    })();
  </script>
