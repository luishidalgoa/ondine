  <script>
    (() => {
      const cb = (x1, y1, x2, y2) => {
        const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
        const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
        return (p) => {
          if (p <= 0) return 0;
          if (p >= 1) return 1;
          let t = p;
          for (let i = 0; i < 8; i++) {
            const e = ((ax * t + bx) * t + cx) * t - p;
            if (Math.abs(e) < 1e-6) break;
            const d = (3 * ax * t + 2 * bx) * t + cx;
            if (Math.abs(d) < 1e-6) break;
            t -= e / d;
          }
          return ((ay * t + by) * t + cy) * t;
        };
      };
      const EASE_OUT = cb(0.16, 1, 0.3, 1);
      const SNAP = cb(0.34, 1.2, 0.64, 1);

      const ANCHOS = ["58%", "42%", "66%", "38%", "52%", "46%", "62%", "40%", "56%",
                      "48%", "64%", "44%", "54%", "60%", "40%", "50%", "66%", "46%"];

      const equis = (px) =>

        'stroke="#C64545" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">' +
        '<path d="M5 5l14 14M19 5L5 19"></path></svg>';
      [0, 2, 4].forEach((i) => {
        document.getElementById("ds-equis-" + i).innerHTML = equis(i === 2 ? 58 : 48);
      });

      const tl = gsap.timeline({ paused: true });

      // 0,00 · el rótulo. El asterisco entra 40 ms antes que el texto.
      tl.fromTo("#ds-spike", { x: -18, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.22, ease: EASE_OUT }, 0);
      tl.fromTo("#ds-kicker-txt", { x: -18, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.22, ease: EASE_OUT }, 0.04);

      // Un nombre por golpe.
      [0.18, 0.83, 1.19, 1.79, 2.59].forEach((t, i) => {
        tl.fromTo("#ds-fila-" + i,
          { y: -16, opacity: 0, filter: "blur(6px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.22, ease: EASE_OUT }, t);
      });

      // 2,59 → 3,05 · quietud. Es el hueco que hace que las ✕ suenen.
      [{ i: 0, t: 3.05, s: 1.4 }, { i: 4, t: 3.57, s: 1.4 }, { i: 2, t: 4.05, s: 1.6 }]
        .forEach((m) => {
          tl.set("#ds-equis-" + m.i, { opacity: 1 }, m.t);
          tl.fromTo("#ds-equis-" + m.i, { scale: m.s },
            { scale: 1, duration: 0.09, ease: SNAP }, m.t);
          tl.to("#ds-nombre-" + m.i, { color: "#6c7080", duration: 0.18, ease: EASE_OUT }, m.t);
        });

      // 4,05 · el golpe más fuerte del spot. `immediateRender: false` o el aro se pinta
      // desde el fotograma 1: un `fromTo` aplica su estado inicial al construirse.
      tl.fromTo("#ds-aro-2", { scale: 0.6, opacity: 0.45 },
        { scale: 1.15, opacity: 0, duration: 0.5, ease: EASE_OUT, immediateRender: false }, 4.05);
      tl.fromTo("#ds-parrilla-cam", { scale: 1 },
        { scale: 1.012, duration: 0.4, ease: EASE_OUT }, 4.05);

      window.__timelines = window.__timelines || {};
      window.__timelines["v02-desorden"] = tl;
