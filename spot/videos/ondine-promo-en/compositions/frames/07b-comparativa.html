        '<svg width="20" height="20" viewBox="0 0 24 24" fill="#E9E9ED" aria-hidden="true">' +
        '<path d="M7 4l13 8-13 8z"></path></svg>';

      // El icono de carátula que falta, el que pone cualquier servidor cuando no ha
      // encontrado nada que colgar ahí.
      const FILM = (px) =>
        '<svg width="' + px + '" height="' + px + '" viewBox="0 0 24 24" fill="none" ' +
        'stroke="#39414D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ' +
        'aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2"></rect>' +
        '<path d="M7 4.5v15M17 4.5v15M2.5 9.5h4.5M2.5 14.5h4.5M17 9.5h4.5M17 14.5h4.5"></path></svg>';

      // La carpeta y los ficheros tal y como salieron de la descarga: nombres puestos
      // a mano y mal. Nada de nombres de grupo ni etiquetas de release — el desorden
      // de una casa son ficheros escritos por una persona, no descargas de scene.
      const CARPETA = "the simpsons season7";
      const CRUDOS = [
        "Ep 12 (2).mkv", "final episode GOOD.mkv", "Season7_04-05.mkv",
        "Untitled (copy).mkv", "the simpsons 7x07.avi", "ep14.mkv",
        "new_ep (1).mkv", "video_1995.mkv", "final download.mkv",
        "unnamed episode.mkv", "S7 - 09.mkv", "recording 3.mkv",
      ];

      // Una sola función construye las dos bibliotecas: misma maqueta, mismo alto de
      // fila, mismo desplazamiento. Lo único que cambia es si sabe o no lo que tiene.
      const biblioteca = (id, real) => {
        const capitulos = CAPS.map((c, i) => {
          const mini = real
            ? '<div class="alt-cap-arte" style="background:' + ARTES_CAP[i % ARTES_CAP.length] + '"></div>' +
              '<div class="alt-cap-mini-fade"></div>' +
              '<div class="alt-cap-mini-play">' + PLAY_MINI + "</div>" +
              '<span class="alt-cap-dur">' + c[2].split(" · ")[0] + "</span>"
            : '<div class="alt-vacia">' + FILM(46) + "</div>" +
              '<span class="alt-cap-dur">' + c[2].split(" · ")[0] + "</span>";
          // Sin sinopsis y sin numerar: el servidor sabe cuánto dura porque lo lee del
          // fichero, y no sabe nada más.
          const texto = real
            ? '<span class="alt-cap-tit" id="' + id + '-cap-tit-' + i + '">' + c[0] + ". " + c[1] + "</span>" +
              '<span class="alt-cap-meta">' + c[2] + "</span>" +
              '<span class="alt-cap-sin">' + c[3] + "</span>"
            : '<span class="alt-crudo">' + CRUDOS[i] + "</span>" +
              '<span class="alt-crudo-meta">' + c[2].split(" · ")[0] + "</span>";
          return '<div class="alt-cap"><div class="alt-cap-mini">' + mini + "</div>" +
                 '<div class="alt-cap-txt">' + texto + "</div></div>";
        }).join("");

        const serie = real
          ? '<span class="alt-serie-tit">The Simpsons</span>' +
            '<div class="alt-serie-meta"><span>Season 7</span><span>·</span>' +
            "<span>13 episodes</span><span>·</span><span>1995</span></div>" +
            '<div class="alt-botonera"><div class="alt-play">' +
            '<svg width="24" height="24" viewBox="0 0 24 24" fill="#101418" aria-hidden="true">' +
            '<path d="M7 4l13 8-13 8z"></path></svg></div>' +
            ICONO('<path d="M4 13l5 5L20 6"></path>', "#8A8FA3") +
            ICONO('<path d="M12 20s-7-4.6-7-9.4A4 4 0 0112 8a4 4 0 017 2.6c0 4.8-7 9.4-7 9.4z"></path>', "#8A8FA3") +
            "</div>"
          : '<span class="alt-serie-crudo">' + CARPETA + "</span>" +
            '<div class="alt-serie-meta"><span>12 videos</span></div>' +
            '<div class="alt-botonera"><div class="alt-play">' +
            '<svg width="24" height="24" viewBox="0 0 24 24" fill="#101418" aria-hidden="true">' +
            '<path d="M7 4l13 8-13 8z"></path></svg></div>' +
            ICONO('<path d="M4 13l5 5L20 6"></path>', "#8A8FA3") +
            ICONO('<path d="M12 20s-7-4.6-7-9.4A4 4 0 0112 8a4 4 0 017 2.6c0 4.8-7 9.4-7 9.4z"></path>', "#8A8FA3") +
            "</div>";

        return '<div class="alt-telon"><div class="alt-telon-fondo"></div>' +
          (real ? '<div class="alt-telon-arte" data-layout-allow-overflow></div>' : "") +
          '<div class="alt-telon-luz" data-layout-allow-overflow></div>' +
          '<div class="alt-telon-monte"></div><div class="alt-telon-fade"></div></div>' +
          BARRA +
          '<div class="alt-visor"><div class="alt-scroll" id="' + id + '-scroll">' +
          '<div class="alt-cabecera"><div class="alt-portada">' +
          (real ? '<div class="alt-portada-arte"></div>'
                : '<div class="alt-vacia">' + FILM(76) + "</div>" +
                  '<span class="alt-portada-nombre">' + CARPETA + "</span>") +
          "</div>" +
          '<div class="alt-serie">' + serie + "</div></div>" +
          '<div class="alt-capitulos">' + capitulos + "</div>" +
          "</div></div>";
      };

      document.getElementById("alt-antes").innerHTML = biblioteca("alt-antes", false);
      document.getElementById("alt-despues").innerHTML = biblioteca("alt-despues", true);

      // ── La línea de tiempo ─────────────────────────────────────────────────
      const tl = gsap.timeline({ paused: true });

      // ── Compás 1 · la pantalla se resuelve entera (0,02 → 2,40) ────────────
      tl.to("#alt-biblios",
        { filter: "blur(0px)", opacity: 1, duration: 2.38, ease: EASE_OUT }, 0.02);
      tl.to("#alt-win-despues", { opacity: 1, duration: 1.8, ease: EASE_OUT }, 0.5);

      // ── Compás 2 · la comparación (2,58 → 5,16) ────────────────────────────
      // Las dos pantallas encogen a la vez y el «después» se va a la derecha. Todo
      // comparte duración y curva: si se separan, la línea deja de coincidir con el
      // borde y la costura canta.
      const ESC = 0.64;
      const SPLIT = 0.86;
      tl.fromTo("#alt-win-antes", { clipPath: "inset(0 0 0 0)" },
        { clipPath: "inset(0 50% 0 0)", duration: SPLIT, ease: EASE_IN_OUT,
          immediateRender: false }, 2.58);
      tl.fromTo("#alt-win-despues", { clipPath: "inset(0 0 0 0)" },
        { clipPath: "inset(0 0 0 50%)", duration: SPLIT, ease: EASE_IN_OUT,
          immediateRender: false }, 2.58);
      tl.fromTo("#alt-antes", { scale: 1, x: 0 },
        { scale: ESC, x: 0, duration: SPLIT, ease: EASE_IN_OUT, immediateRender: false }, 2.58);
      tl.fromTo("#alt-despues", { scale: 1, x: 0 },
        { scale: ESC, x: 960, duration: SPLIT, ease: EASE_IN_OUT, immediateRender: false }, 2.58);
      tl.fromTo("#alt-divisor", { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: EASE_OUT, immediateRender: false }, 2.9);

      // 3,40 · los pies. Escalonados, el «antes» primero: se lee en orden.
      tl.to("#alt-pie-scrim", { opacity: 1, duration: 0.4, ease: EASE_OUT }, 3.3);
      tl.fromTo("#alt-pie-antes", { y: -16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.22, ease: EASE_OUT, immediateRender: false }, 3.4);
      tl.fromTo("#alt-pie-despues", { y: -16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.22, ease: EASE_OUT, immediateRender: false }, 3.48);

      // Las dos mitades se desplazan A LA VEZ, con el mismo valor: es lo único que
      // hace que la comparación sea una comparación y no dos pantallas sueltas.
      tl.fromTo(["#alt-antes-scroll", "#alt-despues-scroll"], { y: 0 },
        { y: -1240, duration: 10.3, ease: "none", immediateRender: false }, 2.6);

      // Acento de lectura en el lado resuelto, mientras la comparación respira.
      [4.05, 4.53, 5.02].forEach((t, i) => {
        tl.to("#alt-despues-cap-tit-" + i, { color: "#e9e9ed", duration: 0.2, ease: EASE_OUT }, t);
        tl.to("#alt-despues-cap-tit-" + i, { color: "#c9ccd6", duration: 0.2, ease: EASE_OUT }, t + 0.2);
      });

      // ── Compás 3 · lectura ─────────────────────────────────────────────────
      // 5,16 → 7,63 · la comparación se queda sola en pantalla un compás entero.

      // ── Compás 4 · «Optimiza tus bibliotecas…» ─────────────────────────────
      tl.to("#alt-velo",
        { "--centro": 0.68, "--borde": 0.78, duration: 0.7, ease: EASE_IN_OUT }, 5.05 + C);
      const wOpt = [];
      document.querySelectorAll("#alt-optimiza .alt-linea")
        .forEach((l) => palabras(l).forEach((w) => wOpt.push(w)));
      tl.to(wOpt, { opacity: 1, duration: 0.26, ease: EASE_OUT, stagger: 0.06 }, 5.2 + C);
      metalizar(document.getElementById("alt-optimiza"), wOpt);
      barrer(document.getElementById("alt-optimiza"), 5.2 + C);

      // Los pies se retiran con el fondo: a partir de aquí manda el cierre.
      tl.to([".alt-pie", "#alt-divisor", "#alt-pie-scrim"],
        { opacity: 0, duration: 0.4, ease: EASE_IN }, 5.05 + C);

      tl.to("#alt-optimiza",
        { y: -28, filter: "blur(10px)", opacity: 0, duration: 0.32, ease: EASE_IN }, 7.1 + C);

      // ── Compás 5 · cierre y bucle ──────────────────────────────────────────
      tl.fromTo("#alt-marca", { scale: 0.96 },
        { scale: 1, duration: SPRING_DUR, ease: SPRING, immediateRender: false }, 7.74 + C);
      tl.fromTo("#alt-marca", { opacity: 0 },
        { opacity: 1, duration: 0.26, ease: EASE_OUT, immediateRender: false }, 7.74 + C);
      tl.to("#alt-velo",
        { "--centro": 0.84, "--borde": 0.88, duration: 0.66, ease: EASE_IN_OUT }, 7.74 + C);

      // kinetic-center-build. El +0,05 em de partida va en `x` por carácter, no en
      // `letter-spacing`: esa propiedad reflowa el texto y el motor de captura lo
      // acusa como tirones.
      const wFrase = palabras(document.getElementById("alt-frase"));
      const SEP = 76 * 0.05;
      const letras = [];
      wFrase.forEach((w) => {
        const chars = [...w.textContent].map((c) => {
          const sp = document.createElement("span");
          sp.className = "ch";
          sp.textContent = c;
          return sp;
        });
        w.textContent = "";
        chars.forEach((c) => { w.appendChild(c); letras.push({ el: c, palabra: w }); });
      });

      metalizar(document.getElementById("alt-frase"), letras.map((l) => l.el));
      barrer(document.getElementById("alt-frase"), 8.8 + C);

      const medio = (letras.length - 1) / 2;
      const centro = (wFrase.length - 1) / 2;
      wFrase.forEach((w, i) => {
        const anillo = Math.round(Math.abs(i - centro));
        const at = 8.8 + C + anillo * 0.07;
        tl.fromTo(w, { opacity: 0, scale: 1.05 },
          { opacity: 1, scale: 1, duration: 0.32, ease: EASE_OUT, immediateRender: false }, at);
        letras.forEach((l, k) => {
          if (l.palabra !== w) return;
          tl.fromTo(l.el, { x: (k - medio) * SEP },
            { x: 0, duration: 0.32, ease: EASE_OUT, immediateRender: false }, at);
        });
      });

      [0, 1, 2, 3].forEach((i) => {
        tl.fromTo("#alt-compat-" + i, { y: -16, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.22, ease: EASE_OUT, immediateRender: false },
          9.6 + C + i * 0.07);
      });
      tl.to("#alt-velo",
        { "--centro": 0.88, "--borde": 0.92, duration: 0.42, ease: EASE_IN_OUT }, 9.6 + C);

      tl.to("#alt-velo",
        { "--centro": 1, "--borde": 1, duration: 0.3, ease: EASE_IN_OUT }, 10.02 + C);

      window.__timelines = window.__timelines || {};
      window.__timelines["07b-comparativa"] = tl;
    })();
  </script>
</template>
