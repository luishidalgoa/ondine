  <script>
    (() => {
      // ── Curvas y presets de la guía (§0 y §1) ──────────────────────────────
      const cb = (x1, y1, x2, y2) => {
        const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
        const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
        return (p) => {
          if (p <= 0) return 0;
          if (p >= 1) return 1;
          let t = p;
          for (let i = 0; i < 8; i++) {
            const e = ((ax * t + bx) * t + cx) * t - p;
            if (Math.abs(e) < 1e-6) break;
            const d = (3 * ax * t + 2 * bx) * t + cx;
            if (Math.abs(d) < 1e-6) break;
            t -= e / d;
          }
          return ((ay * t + by) * t + cy) * t;
        };
      };
      const EASE_OUT = cb(0.16, 1, 0.3, 1);
      const EASE_IN = cb(0.7, 0, 0.84, 0);
      const SPRING_DUR = 0.6;
      const SPRING = (p) => {
        if (p >= 1) return 1;
        const t = p * SPRING_DUR;
        return 1 - Math.exp(-11 * t) * (Math.cos(9.43 * t) + (11 / 9.43) * Math.sin(9.43 * t));
      };

      // Parte un texto en <span> por palabra conservando los espacios.
      const palabras = (el) => {
        const txt = el.textContent;
        el.textContent = "";
        const out = [];
        txt.split(/(\s+)/).forEach((tk) => {
          if (!tk) return;
          if (/^\s+$/.test(tk)) { el.appendChild(document.createTextNode(tk)); return; }
          const sp = document.createElement("span");
          sp.className = "w";
          sp.textContent = tk;
          el.appendChild(sp);
          out.push(sp);
        });
        return out;
      };

      // ── Las pistas ─────────────────────────────────────────────────────────
      // Se quedan las `spa`, se van las `eng`. Las que se quedan no se mueven ni un píxel.
      const CHECK =
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5DB872" ' +
        'stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M4 13l5 5L20 6"></path></svg>';
      const MENOS =
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6C7080" ' +
        'stroke-width="2.4" stroke-linecap="round" aria-hidden="true">' +
        '<path d="M5 12h14"></path></svg>';

      const PISTAS = [
        ["eng", "Audio · English", true],
        ["spa", "Audio · Spanish", false],
        ["eng", "Subtitles · English", true],
        ["spa", "Subtitles · Spanish", false],
      ];
      document.getElementById("adg-pistas").innerHTML = PISTAS.map((p, i) => {
        const queda = p[2];
        const estilo = queda
          ? "background:rgba(93,184,114,0.10);border:1px solid rgba(93,184,114,0.38)"
          : "background:transparent;border:1px solid #26283A";
        const color = queda ? "#E9E9ED" : "#6C7080";
        const meta = queda ? "#8A8FA3" : "#4A4F63";
        return '<div class="adg-pista" id="adg-pista-' + i + '" style="' + estilo + '">' +
          '<span class="adg-pista-icono">' + (queda ? CHECK : MENOS) + "</span>" +
          '<span class="adg-pista-lang" style="color:' + color + '">' + p[0] + "</span>" +
          '<span class="adg-pista-tipo" style="color:' + meta + '">' + p[1] + "</span>" +
          '<span class="adg-pista-estado" style="color:' + meta + '">' +
          (queda ? "se queda" : "se va") + "</span></div>";
      }).join("");

      // ── La línea de tiempo ─────────────────────────────────────────────────
      const tl = gsap.timeline({ paused: true });

      // 0,00 → 0,60 · el cronómetro corre en tiempo real. Que coincida con el reloj
      // de verdad es parte del argumento.
      const crono = { v: 0 };
      const elCrono = document.getElementById("adg-crono");
      tl.to(crono, {
        v: 0.6, duration: 0.6, ease: "none",
        onUpdate: () => { elCrono.textContent = crono.v.toFixed(1) + " s"; },
      }, 0);
      tl.to("#adg-crono", { color: "#e9e9ed", duration: 0.6, ease: "none" }, 0);

      // 0,35 · el tachado se dibuja de izquierda a derecha.
      tl.fromTo("#adg-tachon", { scaleX: 0 },
        { scaleX: 1, duration: 0.26, ease: EASE_OUT }, 0.35);

      // 0,35 y 0,62 · las pistas `eng` salen por la derecha, escalonadas.
      tl.to("#adg-pista-1", { x: 120, opacity: 0, duration: 0.28, ease: EASE_IN }, 0.35);
      tl.to("#adg-pista-3", { x: 120, opacity: 0, duration: 0.28, ease: EASE_IN }, 0.62);

      // 0,50 → 1,85 · la cifra baja de 1024 a 133 MB. Tarda más que el cronómetro a
      // propósito: el reloj mide lo que tarda la operación (0,6 s, y eso no se toca),
      // el número solo se está asentando. Antes acababa en 1,40 y dejaba 0,7 s de
      // pantalla muerta.
      const peso = { v: 1024 };
      const elPeso = document.getElementById("adg-despues");
      tl.to(peso, {
        v: 133, duration: 1.35, ease: EASE_OUT,
        onUpdate: () => { elPeso.textContent = String(Math.round(peso.v)); },
      }, 0.5);
      tl.to("#adg-despues", { color: "#e9e9ed", duration: 1.35, ease: EASE_OUT }, 0.5);
      tl.fromTo("#adg-unidad", { opacity: 0 },
        { opacity: 1, duration: 0.26, ease: EASE_OUT }, 0.5);

      // 1,85 → 2,11 · el respiro justo antes del golpe.

      // 2,11 · el único golpe del plano. En la pista es el mismo instante que antes
      // (25,335 s del spot): el compás que se recorta es el de espera, no el golpe.
      tl.fromTo("#adg-sello", { scale: 1.12 },
        { scale: 1, duration: SPRING_DUR, ease: SPRING, immediateRender: false }, 2.11);
      tl.fromTo("#adg-sello", { opacity: 0 },
        { opacity: 1, duration: 0.26, ease: EASE_OUT, immediateRender: false }, 2.11);
      tl.fromTo("#adg-sello",
        { boxShadow: "0 0 0 10px rgba(93,184,114,0.18)" },
        { boxShadow: "0 0 0 0px rgba(93,184,114,0)", duration: 0.24, ease: EASE_OUT,
          immediateRender: false }, 2.11);

      // …y su texto entra palabra a palabra 80 ms después de la escala.
      const pal = palabras(document.getElementById("adg-sello-txt"));
      tl.fromTo(pal, { opacity: 0 },
        { opacity: 1, duration: 0.26, ease: EASE_OUT, stagger: 0.06, immediateRender: false }, 2.19);

      // 2,37 → 2,58 · quietud.

      window.__timelines = window.__timelines || {};
      window.__timelines["05-adelgaza"] = tl;
    })();
  </script>
