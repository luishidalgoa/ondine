<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"
      integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2"
      crossorigin="anonymous"
    ></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #161826;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #161826;
      }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- Proyecto mínimo cuyo único fin es sacar la miniatura.
         Existe porque una composición NO se puede renderizar suelta: tiene que
         estar montada desde un index.html, y la del spot no la monta porque no
         forma parte del vídeo. Aquí dura un segundo, que es lo que hace falta
         para capturar un fotograma quieto. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div
        id="el-miniatura"
        class="scene"
        data-composition-id="miniatura"
        data-composition-src="compositions/miniatura.html"
        data-start="0"
        data-duration="1"
        data-track-index="0"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      window.__timelines["main"].to({}, { duration: 1 }, 0);
    </script>
  </body>
</html>
