      // ── Curvas de la guía (§0) ─────────────────────────────────────────────
      const cb = (x1, y1, x2, y2) => {
        const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
        const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
        return (p) => {
          if (p <= 0) return 0;
          if (p >= 1) return 1;
          let t = p;
          for (let i = 0; i < 8; i++) {
            const e = ((ax * t + bx) * t + cx) * t - p;
            if (Math.abs(e) < 1e-6) break;
            const d = (3 * ax * t + 2 * bx) * t + cx;
            if (Math.abs(d) < 1e-6) break;
            t -= e / d;
          }
          return ((ay * t + by) * t + cy) * t;
        };
      };
      const EASE_OUT = cb(0.16, 1, 0.3, 1);
      const SNAP = cb(0.34, 1.2, 0.64, 1);

      tl.fromTo("#des-kicker-txt", { x: -18, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.22, ease: EASE_OUT }, 0.04);

      // ── Un nombre por golpe · short-slide-down + desenfoque 6 → 0 ──────────

        tl.fromTo("#des-fila-" + i,

      // 2,59 → 3,05 · quietud. Es el hueco que hace que las ✕ suenen.

      // ── Las marcas ─────────────────────────────────────────────────────────
      // Sin fundido: escala 1,4 → 1 en 90 ms, seco. El nombre marcado baja a #6C7080.

        { i: 0, t: 3.05, s: 1.4 },
        { i: 4, t: 3.57, s: 1.4 },
        { i: 2, t: 4.05, s: 1.6 },
      ];
      MARCAS.forEach((m) => {
        tl.set("#des-equis-" + m.i, { opacity: 1 }, m.t);
        tl.fromTo("#des-equis-" + m.i, { scale: m.s },

        tl.to("#des-nombre-" + m.i, { color: "#6c7080", duration: 0.18, ease: EASE_OUT }, m.t);
