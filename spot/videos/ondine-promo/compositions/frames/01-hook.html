<template>
  <div data-composition-id="01-hook" data-width="1920" data-height="1080" data-start="0" data-duration="5.161">

    <!-- El suelo va en su propia capa .clip a duración completa. Un `background` en la raíz lo
         puede perder el compositor y el fotograma sale negro. -->
    <div id="hook-ground" class="clip hook-ground" data-start="0" data-duration="5.161"></div>

    <div id="hook-stage" class="clip hook-stage" data-start="0" data-duration="5.161">
      <!-- Las partículas van en canvas y no en divs: la receta de DOM tiene tope de ~40 por el
           coste de escribir estilos en cada fotograma, y aquí hacen falta más de mil para que el
           trazo tenga su grosor de verdad. En canvas se repinta todo desde el valor del driver,
           así que la posición sigue siendo función pura del tiempo — que es lo que hace que un
           salto a cualquier fotograma caiga bien. -->
      <canvas id="hook-canvas" width="1920" height="1080" data-layout-allow-overflow></canvas>

      <!-- La marca, de donde se muestrean los puntos de destino. Oculta: solo es la fuente
           geométrica. Es literalmente docs/marca/ondine-marca-oscuro.svg. -->
      <svg id="hook-src" viewBox="0 0 64 64" width="64" height="64" fill="none"
           stroke="#968AE0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        <path id="hook-p0" d="M7 17 C 15.5 9 26.5 25 35 17 C 43.5 9 48.5 25 57 17"></path>
        <path id="hook-p1" d="M7 32 C 16 28 26 36 35 32 C 44 28 48 36 57 32"></path>
        <path id="hook-p2" d="M7 47 L 57 47"></path>
      </svg>

      <!-- El polvo que suelta el filo al pasar. Va en SU PROPIO canvas porque el de la marca se
           desplaza -470 px, y el polvo tiene que quedarse quieto sobre el nombre. -->
      <canvas id="hook-dust" width="1920" height="1080"></canvas>

      <div id="hook-lockup">
        <div id="hook-word">Ondine</div>
      </div>
    </div>
  </div>

  <style>
    #hook-ground {
      position: absolute;
      inset: 0;
      background: #161826;
    }

    #hook-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #hook-canvas,
    #hook-dust {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
    }

    /* La fuente geométrica no se pinta: solo se le piden puntos con getPointAtLength. */
    #hook-src {
      position: absolute;
      left: -400px;
      top: -400px;
      opacity: 0;
      pointer-events: none;
    }

    #hook-lockup {
      position: absolute;
      left: 909px;
      top: 0;
      height: 1080px;
      display: flex;
      align-items: center;
    }

    #hook-word {
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      font-size: 248px;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1;
      color: #E9E9ED;
      white-space: nowrap;
      /* El eje óptico del manual: la marca se alinea con la altura de la equis, no con la caja
         de texto. De ahí el descuelgue. */
      padding-bottom: 26px;
    }
  </style>

  <script>
    (() => {
      const DUR = 5.161;
      const MARK_SCALE = 10.5;       // retícula 64 -> el trazo ocupa 315 px de alto
      const GROSOR = 6 * MARK_SCALE; // 63 px: el stroke-width real de la marca, a escala
      const CX = 960, CY = 540;
      const FLY = 1.15;              // lo que tarda UNA partícula en llegar
      const START = 0.30;
      const SPREAD = 0.85;           // escalonado izquierda→derecha: la marca «se escribe»
      const SLIDE_AT = 2.44;   // sobre el primer acento de la musica
      const SLIDE_DUR = 0.65;  // termina en 3.09 = el acento siguiente
      const WIPE_AT = SLIDE_AT + SLIDE_DUR;   // el nombre NO empieza hasta que la marca ha parado
      const TOTAL = 1500;

      // Ruido determinista: nada de Math.random, que rompería el render.
      const prand = (n) => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };

      const canvas = document.getElementById("hook-canvas");
      const ctx = canvas.getContext("2d");

      const paths = ["hook-p0", "hook-p1", "hook-p2"].map((id) => document.getElementById(id));
      const largos = paths.map((p) => p.getTotalLength());
      const largoTotal = largos.reduce((a, b) => a + b, 0);

      // ── Muestrear la BANDA del trazo, no su línea central ──
      // Antes las partículas caían sobre el eje del path y la marca salía como un alambre. El
      // trazo de verdad mide 63 px a esta escala, así que cada partícula elige un punto a lo
      // largo del recorrido Y un desplazamiento perpendicular dentro de ese ancho.
      const parts = [];
      let i = 0;
      paths.forEach((path, pi) => {
        const cuantas = Math.round((largos[pi] / largoTotal) * TOTAL);
        for (let k = 0; k < cuantas; k++) {
          const s = (prand(i * 2.7 + 19) * 0.998 + 0.001) * largos[pi];
          const pt = path.getPointAtLength(s);

          // La perpendicular sale de la tangente, tomada con dos puntos muy juntos.
          const d = Math.min(0.6, largos[pi] * 0.02);
          const a = path.getPointAtLength(Math.max(0, s - d));
          const b = path.getPointAtLength(Math.min(largos[pi], s + d));
          const tgx = b.x - a.x, tgy = b.y - a.y;
          const norma = Math.hypot(tgx, tgy) || 1;
          const nx = -tgy / norma, ny = tgx / norma;

          const r = 2.0 + prand(i * 13.9 + 9) * 2.6;
          // Reparto uniforme por el ancho de la banda, dejando sitio al radio para que el borde
          // no se desborde.
          const u = prand(i * 3.3 + 7) * 2 - 1;
          const off = u * (GROSOR / 2 - r);

          const tx = CX + (pt.x - 32) * MARK_SCALE + nx * off;
          const ty = CY + (pt.y - 32) * MARK_SCALE + ny * off;

          const ang = prand(i * 5.1 + 2) * Math.PI * 2;
          const rad = 980 + prand(i * 7.7 + 3) * 1150;

          parts.push({
            tx, ty,
            sx: CX + Math.cos(ang) * rad,
            sy: CY + Math.sin(ang) * rad * 0.62,
            delay: START + ((pt.x - 7) / 50) * SPREAD + prand(i * 11.3 + 5) * 0.16,
            r,
            claro: prand(i * 17.1 + 11) > 0.74,
          });
          i++;
        }
      });

      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

      function pintar(tiempo) {
        ctx.clearRect(0, 0, 1920, 1080);
        for (const p of parts) {
          const local = (tiempo - p.delay) / FLY;
          if (local <= 0) continue;
          const q = local >= 1 ? 1 : easeOutCubic(local);
          const x = p.sx + (p.tx - p.sx) * q;
          const y = p.sy + (p.ty - p.sy) * q;
          // Llegan encendidas y se enfrían al posarse.
          const alpha = Math.min(1, local * 2.6) * (0.6 + 0.4 * q);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.claro ? "#B5ABFC" : "#968AE0";
          ctx.beginPath();
          ctx.arc(x, y, p.r * (1.5 - 0.5 * q), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      pintar(0);

      // Ancho del nombre. Se mide UNA VEZ aquí, en construcción, y el número entra horneado en
      // los tweens: dentro de un callback no valdría, porque el render salta de fotograma en
      // orden no lineal y la medida saldría de un estado del DOM impredecible.
      // El acotado no es paranoia: si la fuente aún no ha cargado cuando se mide, el ancho sale
      // del tipo de repuesto y el filo se quedaría corto o se pasaría de largo. 820 px es lo que
      // mide «Ondine» en Inter Medium a 248 px.
      const word = document.getElementById("hook-word");
      const medido = Math.round(word.getBoundingClientRect().width);
      const anchoNombre = (medido > 620 && medido < 1040) ? medido : 820;
      const NOMBRE_X = 909;                    // el left del bloque, en coordenadas de pantalla
      const NOMBRE_Y = 540;                    // eje óptico

      // ── El polvo que suelta el filo ──
      // Las partículas nacen a lo largo del nombre, al paso del escalonado de las letras, y se
      // apagan enseguida. Así
      // el nombre y la marca están hechos del mismo material sin repetir el gesto del ensamblaje:
      // si el nombre también se montara átomo a átomo, el truco ya no sorprendería la segunda vez.
      const dust = document.getElementById("hook-dust");
      const dctx = dust.getContext("2d");
      const POLVO = 300;
      const VIDA = 0.55;

      const chispas = [];
      for (let j = 0; j < POLVO; j++) {
        const u = prand(j * 4.1 + 31);          // dónde nace a lo largo del recorrido del filo
        chispas.push({
          u,
          dy: (prand(j * 6.3 + 37) - 0.5) * 230,  // repartidas por la altura del nombre
          vx: 18 + prand(j * 8.9 + 41) * 120,     // salen hacia delante, como una estela
          vy: (prand(j * 10.7 + 43) - 0.5) * 150,
          r: 1.3 + prand(j * 12.1 + 47) * 2.4,
          retardo: prand(j * 14.3 + 53) * 0.06,
          claro: prand(j * 16.7 + 59) > 0.6,
        });
      }

      function pintarPolvo(tiempo) {
        dctx.clearRect(0, 0, 1920, 1080);
        const desde = WIPE_AT;
        const dur = 0.62;
        for (const c of chispas) {
          // Nace cuando el escalonado llega a su posición: el polvo acompaña a la letra que entra.
          const nace = desde + c.u * dur + c.retardo;
          const v = (tiempo - nace) / VIDA;
          if (v <= 0 || v >= 1) continue;
          const x = NOMBRE_X + c.u * anchoNombre + c.vx * v * VIDA;
          const y = NOMBRE_Y + c.dy + c.vy * v * VIDA;
          dctx.globalAlpha = (1 - v) * (1 - v) * 0.9;
          dctx.fillStyle = c.claro ? "#D2CEFD" : "#968AE0";
          dctx.beginPath();
          dctx.arc(x, y, c.r * (1 - v * 0.45), 0, Math.PI * 2);
          dctx.fill();
        }
        dctx.globalAlpha = 1;
      }

      pintarPolvo(0);

      const tl = gsap.timeline({ paused: true });

      // Un solo driver lineal. La física vive en la fórmula, no en la curva.
      const drive = { t: 0 };
      tl.fromTo(drive, { t: 0 }, {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: () => { pintar(drive.t); pintarPolvo(drive.t); },
      }, 0);

      // La marca se aparta y PARA. Solo entonces empieza el nombre: así no existe un fotograma
      // en el que el texto pise el trazo.
      tl.fromTo("#hook-canvas",
        { x: 0 },
        { x: -470, duration: SLIDE_DUR, ease: "power3.inOut" },
        SLIDE_AT);

      // `soft-blur-in` por carácter.
      //
      // Antes esto era una cortinilla con un filo vertical delante, y el resultado leía como
      // ESCRITURA: una barra que recorre un texto descubriéndolo es, para el ojo, un cursor. El
      // mecanismo era otro, pero eso da igual — lo que cuenta es lo que se interpreta.
      //
      // Aquí cada letra aparece EN SU SITIO, desenfocada, y se enfoca al asentarse. Nada recorre
      // nada, así que no hay cursor que imaginar. El escalonado sigue yendo de izquierda a
      // derecha para que el polvo lo acompañe, pero las letras no se descubren: llegan.
      const letras = [...word.textContent].map((c) => {
        const sp = document.createElement("span");
        sp.textContent = c;
        sp.style.display = "inline-block";
        return sp;
      });
      word.textContent = "";
      letras.forEach((sp) => word.appendChild(sp));

      tl.fromTo(letras,
        { opacity: 0, filter: "blur(18px)", y: 10 },
        {
          opacity: 1, filter: "blur(0px)", y: 0,
          duration: 0.42,
          // 0.055 s entre letras: por debajo se lee como un bloque, por encima empieza a
          // parecer otra vez que alguien las va poniendo una a una.
          stagger: 0.055,
          ease: "power2.out",
        },
        WIPE_AT);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-hook"] = tl;
    })();
  </script>
</template>
