        const out = [];
        txt.split(/(\s+)/).forEach((tk) => {
          if (!tk) return;
          if (/^\s+$/.test(tk)) { el.appendChild(document.createTextNode(tk)); return; }
          const sp = document.createElement("span");
          sp.className = "w";
          sp.textContent = tk;
          el.appendChild(sp);
          out.push(sp);
        });
        return out;
      };

      // `immediateRender: false` en todo `fromTo` cuyo estado inicial se vea: un
      // `fromTo` aplica su «from» al construirse, aunque la línea esté pausada en 0.
      const shortSlideRight = (tl, sel, at, op) =>
        tl.fromTo(sel, { x: -18, opacity: 0 },
          { x: 0, opacity: op === undefined ? 1 : op, duration: 0.22, ease: EASE_OUT,
            immediateRender: false }, at);

      const shortSlideDown = (tl, sel, at) =>
        tl.fromTo(sel, { y: -16, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.22, ease: EASE_OUT, immediateRender: false }, at);

      // ── Contenido generado ─────────────────────────────────────────────────
      const EPISODIOS = [
        ["4", "Érase una okupa", "16 abr 2004"],
        ["5", "Érase un ascensor", "23 abr 2004"],
        ["6", "Érase un vecino nuevo", "30 abr 2004"],
        ["7", "Érase una mudanza", "7 may 2004"],
        ["8", "Érase un cumpleaños", "14 may 2004"],
        ["9", "Érase una portera", "21 may 2004"],
        ["10", "Érase un okupa más", "28 may 2004"],
      ];
      document.getElementById("cat-tabla-filas").innerHTML = EPISODIOS.map((e, i) =>
        '<div class="cat-fila" style="background:' + (i % 2 ? "#f6f6fa" : "#fbfbfd") + '">' +
        '<span class="cat-col-n">' + e[0] + "</span>" +
        '<span class="cat-col-t">' + e[1] + "</span>" +
        '<span class="cat-col-f">' + e[2] + "</span></div>").join("");

      const CODIGO = [
        '{ "formato": "reindex/1.0", "serie": "Aquí no hay quien viva" }',
        '{ "num": 4, "temp": 2, "titulo": "Érase una okupa" }',
        '{ "num": 5, "temp": 2, "titulo": "Érase un ascensor" }',
        '{ "num": 6, "temp": 2, "titulo": "Érase un vecino nuevo" }',
      ];
      document.getElementById("cat-codigo-cuerpo").innerHTML = CODIGO.map((txt, i) =>
        '<div class="cat-linea-cod" id="cat-linea-' + i + '">' +
        '<span class="cat-linea-n">' + String(i + 1).padStart(2, "0") + "</span>" +
        '<span class="cat-linea-cuerpo">' +
        '<span class="cat-linea-txt" id="cat-txt-' + i + '">' + txt + "</span>" +
        '<span class="cat-linea-caret" data-layout-allow-overlap id="cat-caret-' + i + '">▌</span>' +
        "</span></div>").join("");

      // La banda de selección mide exactamente lo que mide la URL.
      document.getElementById("cat-seleccion").style.width =
        (document.getElementById("cat-url").offsetWidth + 6) + "px";

      // ── La línea de tiempo ─────────────────────────────────────────────────
      const tl = gsap.timeline({ paused: true });

      // ── Compás de entrada · la página desenfocada y la frase ───────────────
      const wIntro = [];
      document.querySelectorAll("#cat-intro-txt .cat-linea")
        .forEach((l) => palabras(l).forEach((w) => wIntro.push(w)));
      tl.to(wIntro, { opacity: 1, duration: 0.26, ease: EASE_OUT, stagger: 0.06 }, 0.06);
      metalizar(document.getElementById("cat-intro-txt"), wIntro);
      barrer(document.getElementById("cat-intro-txt"), 0.06);

      // 0,90 · la frase sale hacia arriba y el velo se va con ella; el desenfoque de
      // la página resuelve justo al cerrar el compás.
      tl.to("#cat-intro-txt",
        { y: -28, filter: "blur(10px)", opacity: 0, duration: 0.32, ease: EASE_IN }, 0.9);
      tl.to("#cat-intro-velo", { opacity: 0, duration: 0.39, ease: EASE_IN_OUT }, 0.9);
      tl.to("#cat-pagina", { filter: "blur(0px)", duration: 0.42, ease: EASE_OUT }, 0.9);

      // ── El clip ────────────────────────────────────────────────────────────
      // El rótulo entra a medio gas y sube a pleno cuando se pulsa el botón.
      shortSlideRight(tl, "#cat-kicker", T0, 0.55);
      tl.to("#cat-kicker", { opacity: 1, duration: 0.24, ease: EASE_OUT }, T0 + 2.76);

      // El panel espera al fondo, desplazado por la derecha y al 28 % de opacidad.
      // Está centrado en el lienzo (960, 540), así que la traslación se calcula desde
      // ahí: x = centro_deseado − 960.
      const ESC = 1300 / 1648;      // 0,789 · el encuadre de la maqueta
      const X_FUERA = 930;          // izquierda 1240 px
      const X_MEDIO = 170;          // izquierda 480 px
      tl.set("#cat-panel", { x: X_FUERA, scale: ESC }, 0);
      tl.set("#cat-cursor", { x: 1180, y: 880 }, 0);
      tl.to("#cat-cursor", { opacity: 1, duration: 0.18, ease: EASE_OUT }, T0);

      // 0,50 · el cursor llega a la barra de direcciones.
      tl.to("#cat-cursor", { x: 520, y: 168, duration: 0.42, ease: EASE_IN_OUT }, T0 + 0.5);

      // 1,13 · clic.
      tl.to("#cat-cursor", { scale: 0.88, duration: 0.06, ease: SNAP }, T0 + 1.13);
      tl.to("#cat-cursor", { scale: 1, duration: 0.06, ease: SNAP }, T0 + 1.19);

      // 1,52 · la URL se selecciona de un barrido. Es lo que se copia: la dirección,
      // no la tabla.
      tl.fromTo("#cat-seleccion", { scaleX: 0 },
        { scaleX: 1, duration: 0.24, ease: EASE_OUT, immediateRender: false }, T0 + 1.52);

      // 2,11 · relevo cruzado: la página se va por la izquierda, el panel sube.
      tl.to("#cat-pagina",
        { x: -276, filter: "blur(8px)", opacity: 0.4, duration: 0.49, ease: EASE_IN }, T0 + 2.11);
      tl.to("#cat-panel", { x: X_MEDIO, opacity: 1, duration: 0.49, ease: EASE_OUT }, T0 + 2.11);

      // 2,11 · la URL aterriza en el campo y el borde se enciende.
      shortSlideRight(tl, "#cat-campo-txt", T0 + 2.11);
      tl.to("#cat-campo-txt", { color: "#e9e9ed", duration: 0.2, ease: EASE_OUT }, T0 + 2.11);
      tl.to("#cat-campo", { borderColor: "#968ae0", duration: 0.2, ease: EASE_OUT }, T0 + 2.11);

      // El cursor cruza al botón para que el golpe del 2,76 tenga autor. Con el panel
      // a escala 0,789 el botón cae en (646, 462) del lienzo.
      tl.to("#cat-cursor", { x: 646, y: 462, duration: 0.42, ease: EASE_IN_OUT }, T0 + 2.3);

      // 2,76 · el golpe: se pulsa «Generar con IA…». Único voltaje del plano.
      tl.to("#cat-boton", { scale: 0.97, duration: 0.06, ease: SNAP }, T0 + 2.76);
      tl.to("#cat-boton", { scale: 1, duration: 0.06, ease: SNAP }, T0 + 2.82);
      tl.to("#cat-boton",
        { backgroundColor: "#968ae0", borderColor: "#968ae0", color: "#161826", duration: 0.09, ease: EASE_OUT },
        T0 + 2.76);
      tl.to("#cat-cursor", { scale: 0.88, duration: 0.06, ease: SNAP }, T0 + 2.76);
      tl.to("#cat-cursor", { scale: 1, duration: 0.06, ease: SNAP }, T0 + 2.82);
      tl.fromTo("#cat-halo", { opacity: 0.18 },
        { opacity: 0, duration: 0.3, ease: EASE_OUT, immediateRender: false }, T0 + 2.76);

      // 2,76 · remate de la salida de la página clara: ya no vuelve.
      tl.to("#cat-pagina",
        { x: -1336, opacity: 0, filter: "blur(14px)", duration: 0.4, ease: EASE_IN }, T0 + 2.76);

      // 3,00 · el único movimiento de «cámara» del spot: el panel al borde del lienzo.
      tl.to("#cat-panel", { x: 0, scale: 1, duration: 0.52, ease: EASE_IN_OUT }, T0 + 3.0);
      tl.to("#cat-cursor", { opacity: 0, duration: 0.3, ease: EASE_IN }, T0 + 3.0);

      // Con el catálogo ya generado el botón vuelve a reposo: el voltaje era el instante.
      tl.to("#cat-boton",
        { backgroundColor: "rgba(0,0,0,0)", borderColor: "#5d5294", color: "#8a8fa3", duration: 0.3, ease: EASE_OUT },
        T0 + 3.4);
      tl.to("#cat-campo", { borderColor: "#33364a", duration: 0.3, ease: EASE_OUT }, T0 + 3.4);
      tl.to("#cat-campo-txt", { color: "#8a8fa3", duration: 0.3, ease: EASE_OUT }, T0 + 3.4);

      // ── El catálogo se escribe solo · una línea por golpe ──────────────────
      // La guía pide 22 ms/carácter, pero la primera línea son 62 caracteres y se
      // comería el golpe siguiente. Se recorta a la ventana disponible: manda «una
      // línea por golpe», que es lo que el oído nota.
      const GOLPES = [T0 + 3.4, T0 + 4.05, T0 + 4.52, T0 + 5.0];
      const FIN = T0 + 5.9;

      CODIGO.forEach((txt, i) => {
        const at = GOLPES[i];
        const hueco = (i + 1 < GOLPES.length ? GOLPES[i + 1] : FIN) - at;
        const dur = Math.min(txt.length * 0.022, hueco - 0.08);
        const pasos = txt.length;

        shortSlideDown(tl, "#cat-linea-" + i, at);

        tl.fromTo("#cat-txt-" + i,
          { clipPath: "inset(0 100% 0 0)" },
          { clipPath: "inset(0 0% 0 0)", duration: dur, ease: "steps(" + pasos + ")",
            immediateRender: false },
          at);

        // El caret acompaña al borde del recorte con la misma cadencia y se queda
        // parpadeando a 2 Hz hasta que la línea siguiente se lo lleva. Repeticiones
        // contadas, no `repeat: -1`: la composición tiene una ventana finita.
        const ancho = document.getElementById("cat-txt-" + i).offsetWidth;
        tl.set("#cat-caret-" + i, { opacity: 1 }, at);
        tl.fromTo("#cat-caret-" + i, { x: 0 },
          { x: ancho, duration: dur, ease: "steps(" + pasos + ")", immediateRender: false }, at);
        const hasta = i + 1 < GOLPES.length ? GOLPES[i + 1] : DUR;
        const ciclos = Math.max(1, Math.ceil((hasta - at - dur) / 0.5));
        tl.to("#cat-caret-" + i,
          { opacity: 0, duration: 0.25, repeat: ciclos * 2, yoyo: true, ease: "none" }, at + dur);
        tl.set("#cat-caret-" + i, { opacity: 0 },
          i + 1 < GOLPES.length ? GOLPES[i + 1] : DUR - 0.001);
      });

      // 5,30 · la cifra aterriza y cuenta hasta 24 en lineal.
      tl.fromTo("#cat-contador", { scale: 0.94 },
        { scale: 1, duration: SPRING_DUR, ease: SPRING, immediateRender: false }, T0 + 5.3);
      tl.fromTo("#cat-contador", { opacity: 0 },
        { opacity: 1, duration: 0.26, ease: EASE_OUT, immediateRender: false }, T0 + 5.3);
      const cifra = { v: 0 };
      tl.to(cifra, {
        v: 24, duration: 0.6, ease: "none",
        onUpdate: () => {
          document.getElementById("cat-contador-n").textContent = String(Math.round(cifra.v));
        },
      }, T0 + 5.3);

      // 5,90 → 6,45 · quietud.

      window.__timelines = window.__timelines || {};
      window.__timelines["03-catalogo"] = tl;
    })();
  </script>
</template>
