        ["4", "Érase una okupa", "34 min · S02E04", "Una desconocida se instala en el 3ºA y el vecindario descubre que nadie sabe de quién es el piso."],
        ["5", "Érase un ascensor", "34 min · S02E05", "El ascensor se avería con media escalera dentro y la reunión de vecinos acaba en el hueco."],
        ["6", "Érase un vecino nuevo", "33 min · S02E06", "Llega un inquilino con demasiadas cajas y muy pocas explicaciones."],
        ["7", "Érase una mudanza", "35 min · S02E07", "Dos familias se cambian de piso el mismo día y ninguna avisó al portero."],
        ["8", "Érase un cumpleaños", "34 min · S02E08", "La fiesta sorpresa se organiza en el rellano porque nadie cabe en el salón."],
        ["9", "Érase una portera", "33 min · S02E09", "La portería cambia de manos y con ella todas las llaves del edificio."],
        ["10", "Érase una obra", "34 min · S02E10", "El tercero derriba un tabique y el edificio entero descubre que era de carga."],
        ["11", "Érase un apagón", "33 min · S02E11", "Se va la luz en toda la finca y la escalera se llena de linternas y de reproches."],
        ["12", "Érase una boda", "35 min · S02E12", "Media comunidad está invitada y la otra media se entera por el felpudo."],
        ["13", "Érase un veraneo", "34 min · S02E13", "Todos se van el mismo fin de semana y alguien tiene que regar las plantas."],
        ["14", "Érase una junta", "33 min · S02E14", "La reunión empieza a las ocho y no termina en toda la noche."],
        ["15", "Érase una despedida", "36 min · S02E15", "El primero A se muda y el portal se queda sin quien lo aguante."],
      ];
      const PLAY_MINI =
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="#E9E9ED" aria-hidden="true">' +
        '<path d="M7 4l13 8-13 8z"></path></svg>';

      document.getElementById("cie-capitulos").innerHTML = CAPS.map((c, i) =>
        '<div class="cie-cap">' +
        '<div class="cie-cap-mini">' +
        '<div class="cie-cap-arte" id="cie-cap-arte-' + i + '" style="background:' + ARTES_CAP[i % ARTES_CAP.length] + '"></div>' +
        '<div class="cie-cap-mini-fade" id="cie-cap-fade-' + i + '"></div>' +
        '<div class="cie-cap-mini-play" id="cie-cap-play-' + i + '">' + PLAY_MINI + "</div>" +
        '<span class="cie-cap-dur" id="cie-cap-dur-' + i + '">' + c[2].split(" · ")[0] + "</span>" +
        '<div class="cie-cap-mini-hueco" id="cie-cap-mh-' + i + '"><div class="cie-placa cie-placa-baja" style="width:' + ANCHOS[i] + '"></div></div>' +
        "</div>" +
        '<div class="cie-cap-txt">' +
        '<div class="cie-cap-real" id="cie-cap-real-' + i + '">' +
        '<span class="cie-cap-tit" id="cie-cap-tit-' + i + '">' + c[0] + ". " + c[1] + "</span>" +
        '<span class="cie-cap-meta">' + c[2] + "</span>" +
        '<span class="cie-cap-sin">' + c[3] + "</span>" +
        "</div>" +
        '<div class="cie-cap-hueco" id="cie-cap-hueco-' + i + '">' +
        '<span class="cie-desconocido">Desconocido</span>' +
        '<div class="cie-placa" style="width:' + ANCHOS[i] + '"></div>' +
        '<div class="cie-placa cie-placa-baja" style="width:' + ANCHOS[(i + 5) % ANCHOS.length] + '"></div>' +
        "</div></div></div>").join("");

      // ── La línea de tiempo ─────────────────────────────────────────────────
      const tl = gsap.timeline({ paused: true });

      // ── Compás 1 · la pantalla se resuelve (0,02 → 1,90) ───────────────────
      // Un solo parámetro conduce el compás: el desenfoque. Ahora tarda 2,38 s en
      // resolver en vez de 1,13: la materialización tiene que dar tiempo a mirarla,
      // y con eso ocupa el compás entero — resuelve justo antes de que arranque el
      // desplazamiento en el 2,60.
      tl.to("#cie-biblio",
        { filter: "blur(0px)", opacity: 1, duration: 2.38, ease: EASE_OUT }, 0.02);

      // ── Todo a la vez, no por oleadas ──────────────────────────────────────
      // Por oleadas —primero la portada, después los capítulos— la pantalla parecía
      // una web cargando en diferido, y eso cuenta otra historia: la de un servidor
      // lento. Lo que pasa aquí es que el servidor DEJA de no saber qué tiene, y eso
      // le ocurre a la biblioteca entera en el mismo instante. Las placas se van
      // juntas y el contenido real llega junto; los dos tramos se solapan para que
      // sea un fundido y no un relevo.
      const sel = (pref) => CAPS.map((c, i) => pref + i);
      const HUECOS = ["#cie-portada-hueco", "#cie-serie-hueco"]
        .concat(sel("#cie-cap-hueco-"), sel("#cie-cap-mh-"));
      const REALES = ["#cie-portada-arte", "#cie-serie-real"]
        .concat(sel("#cie-cap-real-"), sel("#cie-cap-arte-"),
                sel("#cie-cap-fade-"), sel("#cie-cap-play-"), sel("#cie-cap-dur-"));

      tl.to(HUECOS, { opacity: 0, duration: 1.5, ease: EASE_OUT }, 0.3);
      tl.to(REALES, { opacity: 1, duration: 1.8, ease: EASE_OUT }, 0.5);

      // El telón es la misma portada ampliada, así que entra con ella — pero se queda
      // al 42 %, que es lo que lo mantiene como fondo y no como imagen.
      tl.to("#cie-telon-arte", { opacity: 0.42, duration: 1.8, ease: EASE_OUT }, 0.5);

      // ── Compás 2 · la biblioteca se desplaza ───────────────────────────────
      // El desplazamiento nunca se detiene, ni bajo el overlay: es lo que impide que
      // el cierre se sienta congelado.
      tl.fromTo("#cie-scroll", { y: 0 },
        { y: -1240, duration: 7.72, ease: "none", immediateRender: false }, 2.6);

      // Acento de lectura: el capítulo que el scroll trae al centro óptico sube de
      // tono y vuelve. Nada más — el desplazamiento ya es el movimiento.
      [3.09, 3.56, 4.05].forEach((t, i) => {
        tl.to("#cie-cap-tit-" + i, { color: "#e9e9ed", duration: 0.2, ease: EASE_OUT }, t);
        tl.to("#cie-cap-tit-" + i, { color: "#c9ccd6", duration: 0.2, ease: EASE_OUT }, t + 0.2);
      });

      // ── Compás 3 · «Optimiza tus bibliotecas…» ─────────────────────────────
      // La guía cierra el velo de 5,20 a 5,90, pero con EASE_IN_OUT el grueso llega
      // tarde y la frase entra sobre capítulos todavía legibles. Arranca 150 ms antes
      // y cierra un punto más: el texto aterriza sobre un campo ya hundido.
      tl.to("#cie-velo",
        { "--centro": 0.68, "--borde": 0.78, duration: 0.7, ease: EASE_IN_OUT }, 5.05);

      // per-word-crossfade. Sin desplazamiento: el fondo ya se mueve, el texto tiene
      // que estar clavado. Siete palabras a 60 ms = 620 ms; la cuarta cae en el 5,67.
      const wOpt = [];
      document.querySelectorAll("#cie-optimiza .cie-linea")
        .forEach((l) => palabras(l).forEach((w) => wOpt.push(w)));
      tl.to(wOpt, { opacity: 1, duration: 0.26, ease: EASE_OUT, stagger: 0.06 }, 5.2);
      metalizar(document.getElementById("cie-optimiza"), wOpt);
      barrer(document.getElementById("cie-optimiza"), 5.2);

      // 6,45 → 7,10 · lectura. El texto se queda quieto un compás entero.

      // 7,10 · blur-out-up, y el relevo con la marca es un único gesto: la marca
      // arranca 80 ms antes de que el texto acabe de salir (shared-axis-y).
      tl.to("#cie-optimiza",
        { y: -28, filter: "blur(10px)", opacity: 0, duration: 0.32, ease: EASE_IN }, 7.1);

      // ── Compás 4 · cierre y bucle ──────────────────────────────────────────
      // 7,74 · la marca. Trazo y palabra entran juntos, como un solo objeto.
      tl.fromTo("#cie-marca", { scale: 0.96 },
        { scale: 1, duration: SPRING_DUR, ease: SPRING, immediateRender: false }, 7.74);
      tl.fromTo("#cie-marca", { opacity: 0 },
        { opacity: 1, duration: 0.26, ease: EASE_OUT, immediateRender: false }, 7.74);
      tl.to("#cie-velo",
        { "--centro": 0.84, "--borde": 0.88, duration: 0.66, ease: EASE_IN_OUT }, 7.74);

      // 8,80 · kinetic-center-build. El momento tipográfico del cierre: cuatro
      // anillos desde el centro hacia fuera, 70 ms por anillo.
      //
      // El +0,05 em de partida NO se hace con `letter-spacing`: esa propiedad reflowa
      // el texto y clava los glifos en píxeles enteros, y el motor de captura lo nota
      // como tirones. Se hace con un `x` por carácter, simétrico respecto al centro de
      // la línea: el mismo efecto de tracking, pero en transform y sin tocar el layout.
      const wFrase = palabras(document.getElementById("cie-frase"));
      const SEP = 76 * 0.05; // 0,05 em a 76 px de cuerpo
      const letras = [];
      wFrase.forEach((w) => {
        const chars = [...w.textContent].map((c) => {
          const sp = document.createElement("span");
          sp.className = "ch";
          sp.textContent = c;
          return sp;
        });
        w.textContent = "";
        chars.forEach((c) => { w.appendChild(c); letras.push({ el: c, palabra: w }); });
      });

      metalizar(document.getElementById("cie-frase"), letras.map((l) => l.el));
      barrer(document.getElementById("cie-frase"), 8.8);

      const medio = (letras.length - 1) / 2;
      const centro = (wFrase.length - 1) / 2;
      wFrase.forEach((w, i) => {
        const anillo = Math.round(Math.abs(i - centro));
        const at = 8.8 + anillo * 0.07;
        tl.fromTo(w, { opacity: 0, scale: 1.05 },
          { opacity: 1, scale: 1, duration: 0.32, ease: EASE_OUT, immediateRender: false }, at);
        letras.forEach((l, k) => {
          if (l.palabra !== w) return;
          tl.fromTo(l.el, { x: (k - medio) * SEP },
            { x: 0, duration: 0.32, ease: EASE_OUT, immediateRender: false }, at);
        });
      });

      // 9,60 · la compatibilidad, escalonada. Nunca escala: el icono es bitmap.
      [0, 1, 2, 3].forEach((i) => {
        tl.fromTo("#cie-compat-" + i, { y: -16, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.22, ease: EASE_OUT, immediateRender: false },
          9.6 + i * 0.07);
      });
      tl.to("#cie-velo",
        { "--centro": 0.88, "--borde": 0.92, duration: 0.42, ease: EASE_IN_OUT }, 9.6);

      // 10,02 → 10,32 · el centro cierra a negro para encadenar con el arranque en
      // negro del plano 1. El scroll sigue corriendo por debajo hasta el último
      // fotograma; el overlay va por encima del velo y no se apaga.
      tl.to("#cie-velo",
        { "--centro": 1, "--borde": 1, duration: 0.3, ease: EASE_IN_OUT }, 10.02);

      window.__timelines = window.__timelines || {};
      window.__timelines["07-cierre"] = tl;
    })();
  </script>
</template>
